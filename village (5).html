<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blocky Village</title>
<style>
:root{--ui:rgba(24,18,10,.8);--ac:#ffd54a}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0f0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:ui-monospace,"Courier New",monospace,"Noto Sans Bengali",sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pill{position:fixed;background:var(--ui);border:2px solid #fff3;border-radius:10px;padding:5px 11px;font-weight:700;font-size:15px;text-shadow:0 2px 0 #0006}
#coins{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;color:var(--ac)}
#clock{top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}
#lv{top:calc(env(safe-area-inset-top,0px) + 92px);left:10px;font-size:12px}
#pop{top:calc(env(safe-area-inset-top,0px) + 52px);left:10px;font-size:12px}
#gm{top:calc(env(safe-area-inset-top,0px) + 92px);left:128px;font-size:12px;color:#7df}
.bt{position:fixed;width:46px;height:46px;border-radius:10px;border:2px solid #fff4;background:var(--ui);color:#fff;font-size:20px;font-weight:700;padding:0;touch-action:manipulation}
.bt:active{background:#ffffff55}
#bR{right:10px;top:calc(env(safe-area-inset-top,0px) + 10px)}
#bL{right:62px;top:calc(env(safe-area-inset-top,0px) + 10px)}
#bI{right:10px;top:calc(env(safe-area-inset-top,0px) + 62px)}
#bO{right:10px;top:calc(env(safe-area-inset-top,0px) + 114px)}
#bH{right:10px;top:calc(env(safe-area-inset-top,0px) + 166px)}
#bT{right:10px;top:calc(env(safe-area-inset-top,0px) + 218px)}
#bQ{right:10px;top:calc(env(safe-area-inset-top,0px) + 270px)}
.bt.on{background:#7a5412dd}
#bld{top:calc(env(safe-area-inset-top,0px) + 52px);left:128px;font-size:12px}
#stat{position:fixed;top:calc(env(safe-area-inset-top,0px) + 128px);left:10px;width:132px;background:var(--ui);border:2px solid #fff3;border-radius:10px;padding:5px 7px;font-size:11px;touch-action:manipulation}
#stat .sr{display:flex;align-items:center;gap:5px;height:17px}
#stat i{font-style:normal;width:15px;font-size:12px}
#stat u{flex:1;height:7px;background:#0008;border-radius:4px;overflow:hidden;display:block}
#stat s{display:block;height:100%;width:0;border-radius:4px;transition:width .6s}
#stat em{font-style:normal;width:32px;text-align:right;font-weight:700;font-size:11px}
#dq,#toast,#hint,#do button{unicode-bidi:plaintext}
#hint{top:calc(env(safe-area-inset-top,0px) + 232px);left:10px;font-size:12px;line-height:1.4;max-width:62vw;transition:opacity 1s}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);overflow-x:auto;background:linear-gradient(transparent,#000a);touch-action:pan-x;scrollbar-width:none}
.it{flex:0 0 auto;min-width:56px;height:56px;border-radius:10px;border:2px solid #fff4;background:var(--ui);color:#fff;font:700 10px ui-monospace,monospace;padding:2px 4px;touch-action:manipulation;line-height:1.15}
.it b{display:block;font-size:20px;font-weight:400}
.it.on{border-color:var(--ac);background:#7a5412dd}
.row{position:fixed;left:8px;right:8px;display:none;gap:6px;overflow-x:auto;touch-action:pan-x;align-items:center;scrollbar-width:none}
#sub{bottom:calc(env(safe-area-inset-bottom,0px) + 74px)}
#cf{bottom:calc(env(safe-area-inset-bottom,0px) + 132px);justify-content:center}
#cf span{background:var(--ui);padding:8px 10px;border-radius:10px;font-size:13px;font-weight:700;white-space:nowrap}
#cf .it{min-width:50px;height:44px;font-size:20px}
#tg{position:fixed;inset:0;z-index:7;display:none;pointer-events:none}
#tg.on{display:block}
#tg.m{pointer-events:auto;background:#000a}
.tgp{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);width:min(94vw,430px);bottom:calc(env(safe-area-inset-bottom,0px) + 196px);display:flex;gap:10px;background:#2a1e12f4;border:3px solid var(--ac);border-radius:14px;padding:10px;box-shadow:0 6px 0 #0007;animation:tgin .35s ease-out}
#tg.m .tgp{top:50%;bottom:auto;transform:translate(-50%,-50%);animation:none}
#tgav{flex:0 0 66px;height:66px;border:3px solid #1b1b1b;border-radius:10px;overflow:hidden;background:#8fd0f0}
#tg.m #tgav{flex-basis:84px;height:84px}
#tgav svg{display:block;width:100%;height:100%}
.tgb{flex:1;min-width:0}
#tgn{color:var(--ac);font-size:13px;unicode-bidi:plaintext}
#tgt{font-size:14px;line-height:1.45;min-height:40px;white-space:pre-line;margin:2px 0 6px;unicode-bidi:plaintext}
.tgf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tgf button{padding:7px 12px;border-radius:9px;border:2px solid #fff4;background:#4a3620;color:#fff;font:inherit;font-size:13px;touch-action:manipulation}
#tgx{background:#7a5412;border-color:var(--ac)}
@keyframes tgin{from{transform:translate(-50%,26px);opacity:0}}
.it.hl{border-color:#6f6!important;animation:hlp 1s ease-in-out infinite}
@keyframes hlp{50%{box-shadow:0 0 0 5px #6f68;transform:translateY(-4px)}}
#dlg{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:5}
.card{background:#2a1e12;border:2px solid var(--ac);border-radius:14px;padding:16px;max-width:86vw;width:340px;font-size:15px;line-height:1.5}
.card button{display:block;width:100%;margin-top:8px;padding:10px;border-radius:10px;border:2px solid #fff4;background:#4a3620;color:#fff;font:inherit;font-size:14px}
#dq{white-space:pre-line}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 130px);transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:84vw;z-index:6}
#err{display:none;position:fixed;left:6px;right:6px;top:70px;background:#b00020e6;padding:6px 10px;border-radius:8px;font-size:12px;z-index:9;pointer-events:none}

/* graphics modes (17 Nov 2026): blur behind the buttons is only used in ULTRA — on weak phones it re-blurs the moving canvas every frame */
html[data-q=ultra] .pill,html[data-q=ultra] .bt,html[data-q=ultra] #stat{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#bQ[data-m=auto]::after{content:'A';position:absolute;right:4px;bottom:1px;font-size:9px;line-height:1;color:var(--ac);font-weight:700}
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#toast,#hint,.pill,.bt{will-change:auto}
</style></head><body>
<canvas id="cv"></canvas>
<div class="pill" id="coins">🪙 0</div>
<div class="pill" id="clock">☀</div>
<div class="pill" id="pop">👥 0</div><div class="pill" id="lv">🏅 Lv 1</div><div class="pill" id="gm">💠 GM$ 0</div>
<button class="bt" id="bL">⟲</button><button class="bt" id="bR">⟳</button>
<button class="bt" id="bI">＋</button><button class="bt" id="bO">－</button>
<button class="bt" id="bH">⌂</button><button class="bt" id="bT">🕒</button><button class="bt" id="bQ">🔋</button>
<div id="stat"></div><div class="pill" id="bld">👷 0/1</div>
<div class="pill" id="hint"></div>
<div class="row" id="sub"></div><div class="row" id="cf"></div><div id="bar"></div>
<div id="tg"><div class="tgp"><div id="tgav"></div><div class="tgb"><b id="tgn"></b><div id="tgt"></div><div class="tgf"><button id="tgs"></button><button id="tgx"></button></div></div></div></div>
<div id="dlg"><div class="card"><div id="dq"></div><div id="do"></div></div></div>
<div id="toast"></div><div id="err"></div>
<script>try{var _l=localStorage.getItem('nt_lang');if(/^(ar|ru|es|hi|zh|bn)$/.test(_l))document.write('<script src="village-dict.js?v=6"><\/script>')}catch(e){}</script>
<script src="village-gfx.js?v=6"></script>
<script src="village-render.js?v=6"></script>
<script src="village.js?v=6"></script>
</body></html>
