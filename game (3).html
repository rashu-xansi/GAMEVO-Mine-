<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Battle Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* GameVo Mine night-arena theme. Page colours follow the map (set by applyTheme()). */
  :root{--ink:#fff;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.2);--blue:#1E6BFF;--sky:#38BDF8;--acc:#38BDF8;
        --bg1:#0B2A4A;--bg2:#0F4C5C;--gA:rgba(56,189,248,.38);--gB:rgba(80,220,160,.30);--glass:rgba(8,20,48,.66)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:'Inter',system-ui,-apple-system,sans-serif}
  body{background:radial-gradient(75% 42% at 10% 0%,var(--gA),transparent 72%),radial-gradient(70% 42% at 95% 100%,var(--gB),transparent 72%),linear-gradient(180deg,var(--bg1),var(--bg2))}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.9;
    background-image:radial-gradient(1.6px 1.6px at 8% 12%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 22% 6%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1.8px 1.8px at 37% 15%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 52% 4%,rgba(255,255,255,.7),transparent 60%),radial-gradient(1.6px 1.6px at 66% 11%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 81% 5%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1.8px 1.8px at 93% 14%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 6% 90%,rgba(255,255,255,.7),transparent 60%),radial-gradient(1.6px 1.6px at 30% 96%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 58% 92%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1.6px 1.6px at 78% 97%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 96% 88%,rgba(255,255,255,.7),transparent 60%)}
  #app{position:relative;z-index:1;width:100%;max-width:640px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:6px 6px max(6px,env(safe-area-inset-bottom))}
  #hud{flex:none;display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px}
  .chip{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px 12px;box-shadow:0 6px 16px rgba(0,0,0,.3);color:#fff;white-space:nowrap}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;flex:none}
  canvas{display:block;width:100%;height:100%;border-radius:20px;border:2px solid rgba(255,255,255,.32);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.5),0 0 26px var(--gA);touch-action:none;background:#0b1226}
  #bar{position:absolute;left:12px;right:60px;top:11px;height:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);border-radius:6px;overflow:hidden;z-index:3;pointer-events:none}
  #barIn{height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--acc));transition:width .2s}
  #tip{position:absolute;left:12px;right:60px;top:26px;z-index:3;pointer-events:none;text-align:center;font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000a}
  #panel{position:absolute;left:10px;right:60px;bottom:10px;z-index:4;visibility:hidden;align-items:center;gap:6px;background:rgba(8,20,48,.92);border:1px solid var(--line);border-radius:16px;padding:6px 8px;font-size:12px;font-weight:700;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.45);display:flex}
  #panel.show{visibility:visible}
  #panel.top{bottom:auto;top:30px}
  #pinfo{flex:1;line-height:1.25}
  #panel button{padding:8px 9px;font-size:11px;border-radius:11px}
  #shop{flex:none;display:flex;gap:4px;padding:5px;border-radius:20px;background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .sb{flex:1;min-width:0;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.14);border-radius:13px;padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:10px;font-weight:800;cursor:pointer}
  .sb img{width:34px;height:34px;object-fit:contain}
  .sb.sel{border-color:var(--acc);background:rgba(255,255,255,.2);transform:translateY(-3px);box-shadow:0 8px 16px rgba(0,0,0,.4),0 0 14px var(--gA)}
  .sb.cant{opacity:.42}
  .overlay{position:absolute;inset:0;background:rgba(6,14,36,.9);border-radius:20px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:6;color:#fff}
  .overlay.show{display:flex}
  .overlay h2{margin:0;font-family:'Fraunces',serif;font-weight:700;font-size:28px;color:#fff}
  button{background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;border:0;border-radius:14px;padding:13px 22px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(30,107,255,.45)}
  button:active{transform:translateY(2px);box-shadow:0 3px 8px rgba(30,107,255,.3)}
  button.alt{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--line);box-shadow:none}
  button:disabled{opacity:.5}
  .tb{position:relative;width:40px;height:40px;border-radius:50%;padding:0;font-size:17px;background:rgba(8,20,48,.72);color:#fff;border:2px solid rgba(255,255,255,.28);box-shadow:0 4px 10px rgba(0,0,0,.4)}
  .tb.on{border-color:var(--acc);background:rgba(56,189,248,.32)}
  .tb span{position:absolute;bottom:-3px;right:-3px;font-size:10px;font-weight:900;background:var(--blue);color:#fff;border-radius:6px;padding:0 3px}
  #tools{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
  #loading{position:fixed;inset:0;background:#0B2A4A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;z-index:20}
</style>
</head>
<body>
<div id="loading">Loading...</div>
<div id="app">
  <div id="hud">
    <span class="chip" id="lvChip">Stage <b id="lv">1</b> <small id="wv" style="opacity:.8"></small></span>
    <span class="chip">❤️ <b id="hp">20</b></span>
    <span class="chip">🪙 <b id="coins">0</b></span>
  </div>
  <div id="stage"><div id="wrap">
    <canvas id="c" width="720" height="1120"></canvas>
    <div id="bar"><div id="barIn"></div></div>
    <div id="tip"></div>
    <div id="tools"><button class="tb" id="bPause">⏸</button><button class="tb" id="bSpeed">1x</button><button class="tb" id="bZoom">🔍</button><button class="tb" id="bMeteor">☄<span id="mcd"></span></button><button class="tb" id="bSfx">🔊</button><button class="tb" id="bMus">🎵</button><button class="tb" id="bExit" aria-label="Back to app">✕</button></div>
    <div id="panel"><div id="pinfo"></div><button id="upBtn">Upgrade</button><button id="repBtn" class="alt">🔧</button><button id="sellBtn" class="alt">Sell</button></div>
    <div class="overlay" id="win">
      <h2>🏆 Mission Complete!</h2>
      <div id="winInfo"></div>
      <button id="claimBtn">▶ Next stage</button>
    </div>
    <div class="overlay" id="lose">
      <h2>💥 Base Destroyed</h2>
      <div id="loseInfo"></div>
      <button id="retryBtn">Try again</button>
    </div>
  </div></div>
  <div id="shop"></div>
</div>

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function setupMap(n){
  const bi=(n-1)%5,li=((n-1)+Math.floor((n-1)/5))%5;
  BIOME=BIOMES[bi];
  WP=LAYOUTS[li].map(([c,r])=>({x:(c+.5)*CELL,y:(r+.5)*CELL,c,r}));
  pathCells=new Set();blocked=new Set();
  for(let i=0;i<WP.length-1;i++){
    const a=WP[i],b=WP[i+1],dx=Math.sign(b.c-a.c),dy=Math.sign(b.r-a.r);let c=a.c,r=a.r;pathCells.add(c+','+r);
    while(c!==b.c||r!==b.r){c+=dx;r+=dy;pathCells.add(c+','+r);}
  }
  pathCells.forEach(k=>blocked.add(k));
  segLen=[];totalLen=0;

function posAt(d){

let S={state:'idle',towers:[],enemies:[],bullets:[],fx:[],queue:[],waves:[],wi:0,inter:0,coins:0,baseHp:20,killed:0,total:1,hover:null,sel:0,selT:null,banner:null,cfg:null,shake:0,speed:1,paused:false,armed:false,mcd:0,meteors:[],eb:[],zones:[],warn:[],rubble:[],flash:0,hpMul:1,dmgMul:1};

function levelCfg(n){
  return{hp:38*Math.pow(1.15,n-1),speed:Math.min(32+n*1.6,90),gap:Math.max(.5,1.0-n*.01),
         reward:120+n*30,boss:n%5===0,waves:Math.min(12,3+Math.floor(n/2)),per:Math.min(46,14+n*3)};
}
function buildQueue(n,count,boss,wi,waves){
  const q=[];
  const nf=Math.min(FAST.length,2+n),nm=n>=2?Math.min(MED.length,n-1):0,nt=n>=3?Math.min(TANK.length,n-2):0;
  for(let i=1;i<=count;i++){
    let tier,idx;
    if(nt&&i%7===0){tier='tank';idx=TANK[Math.floor(Math.random()*nt)];}
    else if(nm&&Math.random()<.5){tier='med';idx=MED[Math.floor(Math.random()*nm)];}
    else{tier='fast';idx=FAST[Math.floor(Math.random()*nf)];}
    q.push({tier,idx});
  }
  let cc=0;if(n>=2&&wi>=1){cc=Math.min(6,1+Math.floor((n-2)/3));if(wi>=waves-2)cc++;}
  const pool=UNLOCK.slice(0,Math.min(UNLOCK.length,2+n));
  for(let c=0;c<cc;c++){const pos=Math.floor(q.length*(.25+.7*(c+Math.random())/cc));q.splice(Math.min(pos,q.length),0,{tier:'cmd',idx:pool[Math.floor(Math.random()*pool.length)]});}
  if(boss)q.push({tier:'boss',idx:UNLOCK[(Math.floor(n/5)-1)%UNLOCK.length]});
  return q;
}
function tStat(t){const b=TT[t.type],m=t.lvl-1;return{dmg:b.dmg*(1+.55*m),cd:b.cd*Math.pow(.93,m),rng:b.rng+6*m};}
function upCost(t){return Math.round(TT[t.type].cost*.7*t.lvl);}
const spriteSize=(t,l)=>44+((l||t.lvl)-1)*3.5;

function startLevel(){
  setupMap(level);buildBG(level);SFX.music(BIOME.id);applyTheme();
  const cfg=levelCfg(level),waves=[];
  for(let w=0;w<cfg.waves;w++)waves.push(buildQueue(level,cfg.per+w*2,cfg.boss&&w===cfg.waves-1,w,cfg.waves));
  const total=waves.reduce((s,q)=>s+q.length,0);
  S={state:'play',cfg,waves,wi:0,queue:waves[0].slice(),inter:0,total,towers:[],enemies:[],bullets:[],fx:[],killed:0,eb:[],zones:[],warn:[],rubble:[],flash:0,lost:0,hpMul:1+.07*(level-1),dmgMul:1.35*(1+.06*(level-1)),
     coins:140+Math.round(35*(level-1))+bank,baseHp:20,spawnT:3,hover:null,sel:S.sel||0,selT:null,shake:0,speed:S.speed||1,paused:false,armed:false,mcd:12,meteors:[],
     banner:{t:3,text:(cfg.boss?'👹 BOSS STAGE ':'Stage ')+level,sub:BIOME.name+' • '+cfg.waves+' waves'}};
  cam.zt=FITZ;cam.z=FITZ;cam.x=0;cam.y=0;clampCam();
  bank=0;localStorage.setItem('bd_coins',0);
  ['win','lose'].forEach(i=>$(i).classList.remove('show'));
  updateHud();renderShop();
}

/* ---------- UI ---------- */
function renderShop(){
  const sh=$('shop');sh.innerHTML='';
  TT.forEach((t,i)=>{
    const b=document.createElement('div');b.className='sb';b.dataset.i=i;
    b.innerHTML='<img src="'+ASSETS.t[t.k][0]+'"><span>🪙'+t.cost+'</span>';
    b.onclick=()=>{S.sel=i;S.selT=null;S.armed=false;SFX.play('click');updateHud();};sh.appendChild(b);
  });
}
let _hudSig='';
function updateHud(){
  const sig=[level,S.baseHp,Math.floor(S.coins),S.wi,S.killed,S.total,S.sel,S.paused,S.speed,!!S.armed,Math.ceil(S.mcd||0),S.selT?S.selT.lvl+'|'+Math.ceil(S.selT.hp)+'|'+S.selT.maxhp+'|'+S.selT.spent+'|'+((S.selT.y-cam.y)*cam.z/VH>.6):'-',S.state].join(',');
  if(sig===_hudSig)return;_hudSig=sig;
  $('lv').textContent=level;$('hp').textContent=S.baseHp;$('coins').textContent=Math.floor(S.coins);
  $('wv').textContent=S.cfg?'W'+Math.min(S.wi+1,S.cfg.waves)+'/'+S.cfg.waves:'';
  $('lvChip').style.color=(S.cfg&&S.cfg.boss)?'#ff8a8a':'#fff';
  $('barIn').style.width=(S.total?Math.min(100,S.killed/S.total*100):0)+'%';
  document.querySelectorAll('.sb').forEach(b=>{const i=+b.dataset.i;b.classList.toggle('sel',i===S.sel&&!S.selT);b.classList.toggle('cant',S.coins<TT[i].cost);});
  $('bPause').textContent=S.paused?'▶':'⏸';$('bSpeed').textContent=S.speed+'x';
  $('bMeteor').classList.toggle('on',!!S.armed);$('mcd').textContent=S.mcd>0?Math.ceil(S.mcd):'';
  const p=$('panel');
  if(S.selT){
    const t=S.selT,b=TT[t.type],st=tStat(t);p.classList.add('show');p.classList.toggle('top',(t.y-cam.y)*cam.z/VH>.6);
    $('pinfo').innerHTML='<b>'+b.n+'</b> • <span style="color:'+LVCOL[t.lvl]+'">'+TIERNAME[t.lvl]+'</span>'+(t.lvl>=MAXLVL?' ★':'')+'<br><span style="opacity:.8">HP '+Math.ceil(t.hp)+'/'+t.maxhp+' • DMG '+st.dmg.toFixed(0)+'</span>';
    $('upBtn').textContent=t.lvl>=MAXLVL?'MAX':'⬆ 🪙'+upCost(t);
    $('upBtn').disabled=t.lvl>=MAXLVL||S.coins<upCost(t);
    $('sellBtn').textContent='Sell 🪙'+Math.floor(t.spent*.6);
    const rc=repairCost(t);$('repBtn').style.display=rc>0?'':'none';$('repBtn').textContent='🔧 🪙'+rc;$('repBtn').disabled=S.coins<rc;
    $('tip').textContent='';
  } else {p.classList.remove('show');$('tip').textContent=S.armed?'☄ Tap the map to drop a Meteor!':'';}
}
function upgradeTower(t){
  if(!t||t.lvl>=MAXLVL||t.evo||t.build)return;const c=upCost(t);
  if(S.coins<c){SFX.play('error');return;}
  S.coins-=c;t.spent+=c;t.lvl++;{const om=t.maxhp;t.maxhp=towerMax(t);t.hp=Math.min(t.maxhp,t.hp+(t.maxhp-om)+t.maxhp*.2);}t.evo={t:0,T:1.05,flashed:false,from:t.lvl-1};
  SFX.play('charge',t.x,t.y);updateHud();
}
function evolveFlash(t){
  const b=TT[t.type];
  ring(t.x,t.y,b.col,70);ring(t.x,t.y,'#ffffff',48);
  S.fx.push({k:'ring',x:t.x,y:t.y+10,t:.6,T:.6,col:b.col,r:90});
  burst(t.x,t.y-10,b.col,26);burst(t.x,t.y-10,'#ffffff',10);
  S.fx.push({k:'fb',x:t.x,y:t.y-8,t:.5,T:.5,r:54,col:b.col});
  S.shake=Math.max(S.shake,2.5);
  S.fx.push({k:'txt',x:t.x,y:t.y-46,t:1.6,T:1.6,s:TIERNAME[t.lvl].toUpperCase()+'!',col:LVCOL[t.lvl],big:1});
  SFX.play('upgrade',t.x,t.y,{lvl:t.lvl});
}
$('upBtn').onclick=()=>upgradeTower(S.selT);
$('repBtn').onclick=()=>repairTower(S.selT);
$('sellBtn').onclick=()=>{const t=S.selT;if(!t)return;S.coins+=Math.floor(t.spent*.6);S.towers=S.towers.filter(x=>x!==t);burst(t.x,t.y,'#ffd166',14);ring(t.x,t.y,'#ffd166',30);SFX.play('sell',t.x,t.y);S.selT=null;updateHud();};
$('bPause').onclick=()=>{SFX.play('click');if(S.state!=='play')return;S.paused=!S.paused;updateHud();};
$('bSpeed').onclick=()=>{SFX.play('click');S.speed=S.speed===1?2:1;updateHud();};
const ZMAX=4.8,ZLEVELS=[FITZ,1.3,2,3,4.2];
$('bZoom').onclick=()=>{SFX.play('click');let i=ZLEVELS.findIndex(z=>Math.abs(z-cam.zt)<.03);i=(i+1)%ZLEVELS.length;cam.zt=ZLEVELS[i];};
$('bMeteor').onclick=()=>{if(S.state!=='play'||S.mcd>0){SFX.play('error');return;}SFX.play('click');S.armed=!S.armed;S.selT=null;updateHud();};

let ptr=null,pinch=null;const ptrs=new Map();
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;};
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){pinch={d:pdist(),z:cam.zt};ptr=null;}          // two fingers = pinch zoom
  else if(ptrs.size===1)ptr={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,pan:false};
});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const a=[...ptrs.values()],mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,nz=clamp(pinch.z*pdist()/pinch.d,FITZ,ZMAX);
    const w0=toWorld({clientX:mx,clientY:my}),r=cv.getBoundingClientRect();
    cam.z=cam.zt=nz;cam.x=w0.x-(mx-r.left)*VW/r.width/nz;cam.y=w0.y-(my-r.top)*VH/r.height/nz;clampCam();return;
  }
  if(ptr){
    if(!ptr.pan&&Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>8)ptr.pan=true;
    if(ptr.pan){const r=cv.getBoundingClientRect(),k=VW/r.width;cam.x-=(e.clientX-ptr.x)*k/cam.z;cam.y-=(e.clientY-ptr.y)*k/cam.z;ptr.x=e.clientX;ptr.y=e.clientY;clampCam();}
  } else if(e.pointerType==='mouse'&&S.state==='play')S.hover=toWorld(e);
});
cv.addEventListener('pointerup',e=>{
  const had=!!ptr,wasPan=ptr&&ptr.pan;ptr=null;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(had&&!wasPan)tap(toWorld(e));
});
cv.addEventListener('pointercancel',e=>{ptr=null;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;});
cv.addEventListener('pointerleave',()=>{S.hover=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.zt=clamp(cam.zt*(e.deltaY<0?1.15:.87),FITZ,ZMAX);},{passive:false});

function tap(p){
  if(S.state!=='play'||S.paused)return;
  if(S.armed){castMeteor(p.x,p.y);return;}
  const{c,r}=cellAt(p);if(c<0||c>=COLS||r<0||r>=ROWS)return;
  const t=S.towers.find(t=>t.c===c&&t.r===r);
  if(t){S.selT=(S.selT===t)?null:t;updateHud();return;}
  if(blocked.has(c+','+r)){S.selT=null;updateHud();return;}
  if(S.selT){S.selT=null;updateHud();return;}
  const b=TT[S.sel];
  if(S.coins<b.cost){S.fx.push({k:'txt',x:(c+.5)*CELL,y:r*CELL,t:.8,T:.8,s:'Not enough 🪙',col:'#ff7b7b'});SFX.play('error');return;}
  S.coins-=b.cost;
  const nt={c,r,x:(c+.5)*CELL,y:(r+.5)*CELL,type:S.sel,lvl:1,cd:.3,kick:0,flash:0,spent:b.cost,face:1,tilt:0,dx:1,dy:0,shots:0,heat:0,firing:false,build:{t:0,T:.55},evo:null};
  nt.maxhp=towerMax(nt);nt.hp=nt.maxhp;nt.aim=0;
  S.towers.push(nt);SFX.play('place',nt.x,nt.y);updateHud();
}
function castMeteor(x,y){
  S.armed=false;S.mcd=30;S.meteors.push({x,y,t:.75,T:.75});SFX.play('meteor_fall',x,y);updateHud();
}

/* ---------- fx helpers ---------- */
function ring(x,y,col,r=34){S.fx.push({k:'ring',x,y,t:.35,T:.35,col,r});}
function burst(x,y,col,n=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=30+Math.random()*60;S.fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,t:.45,T:.45,col});}}
function txt(x,y,s,col){S.fx.push({k:'txt',x,y,t:.9,T:.9,s,col});}
function puff(x,y,col='rgba(200,200,200,.6)',s=3){S.fx.push({k:'p',x,y,vx:(Math.random()-.5)*10,vy:-8,g:-14,t:.55,T:.55,col,s,grow:1.6});}
function jag(pts){
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,seg=5;
    for(let s=1;s<=seg;s++){const f=s/seg,j=s===seg?0:(Math.random()-.5)*10;out.push({x:a.x+dx*f+nx*j,y:a.y+dy*f+ny*j});}
  }
  return out;
}
function hurt(e,d,col,quiet){
  if(e.dead)return;
  if(e.shield>0){const a=Math.min(e.shield,d);e.shield-=a;d-=a;if(d<=0){e.flash=.04;return;}}
  e.hp-=d;if(!quiet)e.flash=.08;
  if(e.hp<=0){
    e.dead=true;S.killed++;
    const g=e.tier==='boss'?140:(e.tier==='cmd'?45:(e.tier==='tank'?14:(e.tier==='med'?7:4)));S.coins+=g;
    txt(e.x,e.y-14,'+'+g,'#ffd166');burst(e.x,e.y,col||'#fff',e.tier==='boss'?26:(e.tier==='cmd'?16:9));SFX.play('die_'+e.tier,e.x,e.y);SFX.play('coin');
    if(e.tier==='cmd'){ring(e.x,e.y,'#ffd166',50);S.fx.push({k:'txt',x:e.x,y:e.y-34,t:1.2,T:1.2,s:'COMMANDER DOWN!',col:'#ffd166',big:1});S.shake=Math.max(S.shake,2.5);}
    if(e.tier==='boss'){S.shake=Math.max(S.shake,6);ring(e.x,e.y,'#fff',70);}
  }
}
function stun(e,t,frost){if(e.tier==='boss')t*=.4;e.stunT=Math.max(e.stunT,t);if(frost)e.frozen=true;}
function knock(e,px){e.d=Math.max(0,e.d-(e.tier==='boss'?px*.2:px));}
const hitR=e=>e.sz*.32+3;

/* ---------- aiming helpers (lead targeting) ---------- */
function predict(e,T){
  const mt=Math.max(0,T-Math.max(0,e.stunT));
  const sl=e.slowT>0?Math.min(e.slowT,mt):0;
  const dist=e.sp*(.5*sl+(mt-sl));
  return posAt(Math.min(totalLen,e.d+dist));
}
function intercept(m,e,v){
  let T=Math.hypot(e.x-m.x,e.y-m.y)/v,p={x:e.x,y:e.y};
  for(let i=0;i<5;i++){p=predict(e,T);T=Math.hypot(p.x-m.x,p.y-m.y)/v;}
  return{x:p.x,y:p.y,T};
}
function muzzle(t){
  const k=TT[t.type].k,rm=ROTM[k];
  if(rm){
    const base=IMG.rb[k][t.lvl-1]||IMG.rb[k][0],f=fit(base,spriteSize(t)),hw=f.w*HEAD.hs;
    const px=(HEAD.hx-.5)*f.w,py=HEAD.hy*f.h-f.h,a=rm.nat+t.aim,Lm=rm.L*hw;
    return{x:t.x+t.face*(px+Math.cos(a)*Lm),y:t.y+17+py+Math.sin(a)*Lm};
  }
  const arr=MUZ[k],mz=arr[Math.min(arr.length-1,t.lvl-1)];
  const f=fit(IMG.tw[k][t.lvl-1]||IMG.tw[k][0],spriteSize(t));
  return{x:t.x+flipOf(t)*(mz[0]-.5)*f.w,y:t.y+17-f.h+mz[1]*f.h};
}
// Cannon/Gatling sprites face one side; mirror them so the barrel always looks toward the enemy (the muzzle is mirrored the same way)
function flipOf(t){const k=TT[t.type].k;if(k!=='cannon'&&k!=='gatling')return 1;const arr=MUZ[k],mz=arr[Math.min(arr.length-1,t.lvl-1)];return((mz[0]>.5)===(t.face===1))?1:-1;}

/* ---------- commanders: abilities that attack your defences ---------- */
function hitTower(t,dmg){
  if(!t||t.dead||t.build)return;
  t.hp-=dmg;t.hurt=.2;
  S.fx.push({k:'txt',x:t.x+(Math.random()-.5)*10,y:t.y-34,t:.8,T:.8,s:'-'+Math.round(dmg),col:'#ff7b7b'});
  SFX.play('tower_hit',t.x,t.y);
  if(t.hp<=0)destroyTower(t);
}
function dotTower(t,dmg){if(!t||t.dead)return;t.hp-=dmg;if(t.hp<=0)destroyTower(t);}
function destroyTower(t){
  if(t.dead)return;t.dead=true;if(S.selT===t)S.selT=null;
  S.rubble.push({x:t.x,y:t.y,t:30,s:Math.random()*100});
  S.fx.push({k:'fb',x:t.x,y:t.y-6,t:.5,T:.5,r:44,col:'#ff7b2e'});ring(t.x,t.y,'#ffd27f',50);burst(t.x,t.y-6,'#8a8a8a',16);burst(t.x,t.y-6,'#ffb347',10);
  for(let i=0;i<5;i++)puff(t.x+(Math.random()-.5)*20,t.y-8,'rgba(60,60,60,.7)',5);
  S.fx.push({k:'txt',x:t.x,y:t.y-40,t:1.4,T:1.4,s:'💥 DESTROYED',col:'#ff6b6b',big:1});
  S.shake=Math.max(S.shake,4);SFX.play('tower_down',t.x,t.y);S.lost=(S.lost||0)+1;updateHud();
}
function repairTower(t){
  if(!t||t.hp>=t.maxhp)return;const c=repairCost(t);
  if(S.coins<c){SFX.play('error');return;}
  S.coins-=c;t.hp=t.maxhp;t.burnT=0;t.acidT=0;t.frozenT=0;t.stunT=0;t.slowFT=0;
  ring(t.x,t.y,'#5cff9a',34);burst(t.x,t.y-8,'#5cff9a',10);txt(t.x,t.y-34,'🔧 REPAIRED','#5cff9a');SFX.play('repair',t.x,t.y);updateHud();
}
function eb(kind,e,tw,dmg,delay){
  const A=ABIL[kind==='shell'?'barrage':kind],x0=e.x,y0=e.y-22,d=Math.hypot(tw.x-x0,tw.y-y0);
  S.eb.push({kind,x0,y0,x1:tw.x,y1:tw.y-6,x:x0,y:y0,tw,age:0,T:Math.max(.35,d/(kind==='shell'?190:230)),arc:clamp(d*.25,12,40),dmg,col:A.col,delay:delay||0});
}
function castAbility(e,ab){
  const A=ABIL[ab],mul=S.dmgMul||1,cfg=S.cfg;
  const near=r=>S.towers.filter(t=>!t.dead&&!t.build&&Math.hypot(t.x-e.x,t.y-e.y)<=r);
  const aura=()=>{e.castT=.45;S.fx.push({k:'ring',x:e.x,y:e.y,t:.5,T:.5,col:A.col,r:60});};
  if(ab==='summon'){
    const n=e.tier==='boss'?5:3,T=TIER.fast,pool=FAST.slice(0,Math.min(FAST.length,3+Math.floor(level/2)));
    for(let i=0;i<n;i++){const idx=pool[Math.floor(Math.random()*pool.length)];S.enemies.push(mkEnemy({tier:'fast',img:IMG.e[idx],idx,mv:enemyMv(idx),d:Math.max(-15,e.d-12-i*14),hp:cfg.hp*T.hp*.8,sp:cfg.speed*T.sp,sz:T.sz}));S.total++;}
    aura();burst(e.x,e.y,A.col,14);txt(e.x,e.y-40,'💀 SUMMON!',A.col);SFX.play('summon',e.x,e.y);return true;
  }
  if(ab==='shield'){
    let c=0;for(const o of S.enemies){if(o.dead||o.d<0||Math.hypot(o.x-e.x,o.y-e.y)>A.rng)continue;o.shield=cfg.hp*(o.tier==='fast'?1.3:2.5);o.shT=6;c++;S.fx.push({k:'ring',x:o.x,y:o.y,t:.4,T:.4,col:A.col,r:22});}
    if(!c)return false;aura();txt(e.x,e.y-40,'🛡 SHIELD',A.col);SFX.play('e_shield',e.x,e.y);return true;
  }
  if(ab==='heal'){
    let c=0;for(const o of S.enemies){if(o.dead||o.d<0||Math.hypot(o.x-e.x,o.y-e.y)>A.rng||o.hp>=o.max)continue;o.hp=Math.min(o.max,o.hp+o.max*.16);c++;S.fx.push({k:'ring',x:o.x,y:o.y,t:.4,T:.4,col:A.col,r:22});txt(o.x,o.y-18,'+','#5cff9a');}
    if(!c)return false;aura();SFX.play('e_heal',e.x,e.y);return true;
  }
  if(ab==='charge'){
    if(!near(180).length&&!S.towers.some(t=>!t.dead))return false;
    e.chargeT=2.2;aura();txt(e.x,e.y-40,'🐗 CHARGE!',A.col);SFX.play('e_charge',e.x,e.y);return true;
  }
  if(ab==='blink'){

/* ---------- loop ---------- */
let last=performance.now();
const WEAK=((navigator.deviceMemory||4)<=4)||((navigator.hardwareConcurrency||4)<=6);
let QK=2,_ema=16.7,_slow=0,LOWFX=false;
function setQK(k){QK=k;LOWFX=k<=1.3;cv.width=Math.round(VW*k);cv.height=Math.round(VH*k);ctx.setTransform(k,0,0,k,0,0);}
setQK(WEAK?1.5:2);
let _endSkip=0;
function loop(now){
  const raw=now-last;
  // 9 Nov 2026 (CPU): weak phones are capped at ~30 fps, and a finished game (win / lose screen) only repaints ~6 times a second
  if(WEAK&&raw<24){requestAnimationFrame(loop);return;}
  if((S.state==='win'||S.state==='lose')&&(++_endSkip%10)){last=now;requestAnimationFrame(loop);return;}
  if(raw<120){_ema=_ema*.9+raw*.1;if(_ema>(WEAK?40:21)&&QK>1.05){if(++_slow>30){setQK(QK>1.7?1.5:(QK>1.3?1.25:1));_slow=0;_ema=16.7;}}else _slow=0;}   // too slow for ~1 s -> draw with fewer pixels
  const dt=Math.min(.05,raw/1000);last=now;
  camStep();
  if(S.state==='play'&&!S.paused){for(let i=0;i<(S.speed||1);i++)if(S.state==='play')update(dt);}
  draw(now/1000);requestAnimationFrame(loop);
}

function update(dt){

function splash(x,y,r,dmg,col,minF=.4){

}
function impact(b,e){

    } else ring(b.x1,b.y1,'#d9c9a0',22);

  }
  else if(b.type==='gatling'){

    for(let i=0;i<8;i++)S.fx.push({k:'p',x:e.x,y:e.y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,g:20,t:.5,T:.5,col:'#dff8ff',s:2.2});

  }

    SFX.play('boom',x,y);
  }
  else if(b.type==='ballista'){
    const head=Math.random()<.2;hurt(e,b.dmg*(head?3:1),col);

const TMP=document.createElement('canvas');TMP.width=TMP.height=170;const tg=TMP.getContext('2d');
function drawTinted(img,x,y,w,h,col,a){

  tg.clearRect(0,0,170,170);tg.globalCompositeOperation='source-over';tg.globalAlpha=1;tg.drawImage(img,0,0,sw,sh);

const GLOWC={};
function glowSprite(col){

function glow(x,y,r,col,a){

function drawTower(t,time){
  const b=TT[t.type],imgs=IMG.tw[b.k];if(!imgs)return;

      glow(t.x,t.y-8,20+c*16,col,.35*c);ctx.globalCompositeOperation='source-over';
    } else {
      const qq=(q-.4)/.6;sc*=1+.32*Math.exp(-5*qq)*Math.cos(9*qq);whiteA=.9*(1-qq)*(1-qq);
      const a=Math.max(0,1-qq),w=28*(1-qq*.5);
      ctx.globalCompositeOperation='lighter';
      const pg=ctx.createLinearGradient(0,t.y-120,0,t.y+14);pg.addColorStop(0,hexA(col,0));pg.addColorStop(1,hexA(col,.75*a));
      ctx.fillStyle=pg;ctx.fillRect(t.x-w/2,t.y-120,w,134);ctx.globalCompositeOperation='source-over';
    }
  }
  // status tint
  let tint=null,tintA=0;
  if(whiteA>0){tint='#ffffff';tintA=whiteA;}
  else if(t.hurt>0){tint='#ff3030';tintA=.55;}
  else if(t.frozenT>0){tint='#7fe0ff';tintA=.55;}
  else if(t.burnT>0){tint='#ff6a10';tintA=.25+.1*Math.sin(time*20);}
  else if(t.slowFT>0){tint=t.slowKind==='web'?'#ffffff':'#7aff7a';tintA=.28+.08*Math.sin(time*8);}
  ctx.save();
  ctx.translate(t.x+shx-(rm?0:t.dx*t.kick*2.5),t.y+17+dropY+shy-bob-(rm?0:t.dy*t.kick*1.5));
  if(rm){
    ctx.scale(sc*t.face/sq,sc*sq);
    ctx.drawImage(im,-f.w/2,-f.h,f.w,f.h);if(tintA>0)drawTinted(im,-f.w/2,-f.h,f.w,f.h,tint,tintA);
    const head=IMG.rh[b.k],hw=f.w*HEAD.hs,hh=hw*head.height/head.width,pvx=(HEAD.hx-.5)*f.w,pvy=HEAD.hy*f.h-f.h,rec=t.kick*3.4;
    ctx.translate(pvx,pvy);ctx.rotate(t.aim);ctx.translate(-Math.cos(rm.nat)*rec,-Math.sin(rm.nat)*rec);
    ctx.drawImage(head,-rm.pv[0]*hw,-rm.pv[1]*hh,hw,hh);if(tintA>0)drawTinted(head,-rm.pv[0]*hw,-rm.pv[1]*hh,hw,hh,tint,tintA);

  if(rm&&L>=2){const mz=muzzle(t);glow(mz.x,mz.y,7+2.5*L,col,.16+.05*L);}
  ctx.globalCompositeOperation='source-over';
  if(L>=MAXLVL){ctx.strokeStyle='rgba(255,215,100,.75)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(t.x,t.y+13,26,10,0,time*2,time*2+4.2);ctx.stroke();}

  if(b.k==='orb'){ctx.globalCompositeOperation='lighter';for(let i=0;i<3;i++){const a=time*2.6+i*2.09;glow(t.x+Math.cos(a)*11,topY+10+Math.sin(a)*4,5,'#e0a8ff',.9);}ctx.globalCompositeOperation='source-over';}
  if(b.k==='gatling'&&t.heat>.05){ctx.globalCompositeOperation='lighter';glow(t.x,t.y-6,16,'#ff7a1a',t.heat*.5);ctx.globalCompositeOperation='source-over';}
  if(t.flash>0){
    const mz=muzzle(t),fr=(b.k==='gatling'?9:15)*(1+.12*L)*t.flash+3;
    ctx.globalCompositeOperation='lighter';glow(mz.x,mz.y,fr+6,b.k==='cannon'?'#ffb347':col,.85*t.flash);
    ctx.fillStyle='rgba(255,255,255,'+(.8*t.flash)+')';ctx.beginPath();ctx.arc(mz.x,mz.y,fr*.28,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';
  }
  // stun sparks
  if(t.stunT>0){ctx.strokeStyle='#ffe95a';ctx.lineWidth=1.5;for(let i=0;i<3;i++){const a=time*14+i*2.1;ctx.beginPath();ctx.moveTo(t.x+Math.cos(a)*10,topY+10+Math.sin(a)*4);ctx.lineTo(t.x+Math.cos(a)*14+Math.random()*4,topY+10+Math.sin(a)*6+Math.random()*4);ctx.stroke();}}
  // HP bar + status icons
  const bw=28,bx=t.x-bw/2,by=Math.max(t.y-34,topY-7),hf=clamp(t.hp/t.maxhp,0,1);

  ctx.fillStyle=hf>.5?'#58e05a':(hf>.25?'#ffc233':(Math.sin(time*12)>0?'#ff4040':'#ff9090'));ctx.fillRect(bx,by,bw*hf,4);
  if(t.hurt>0){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(bx-1,by-1,bw+2,6);}
  const ic=[];if(t.frozenT>0)ic.push('❄');if(t.burnT>0)ic.push('🔥');if(t.slowFT>0)ic.push(t.slowKind==='web'?'🕸':'☠');if(t.acidT>0)ic.push('🧪');if(t.stunT>0)ic.push('⚡');

}
function drawEnemy(e,time){
  const f=fit(e.img,e.sz),ph=e.ph,alive=e.stunT<=0;
  let oy=0,rot=e.dirx*.03,sx=1,sy=1,shS=1,shA=.32;
  if(alive||e.mv==='fly'){
    const s=Math.abs(Math.sin(ph));
    if(e.mv==='fly'){oy=-9+Math.sin(time*3+e.bob)*3.5;rot=e.dirx*.1+Math.sin(time*2+e.bob)*.04;shS=.7;shA=.2;sy=1+Math.sin(time*6+e.bob)*.02;}
    else if(e.mv==='skit'){oy=-s*1.6;rot=Math.sin(ph)*.1+e.dirx*.04;sx=1+Math.sin(ph*2)*.03;}

    else if(e.mv==='heavy'){oy=-s*3.2;rot=Math.sin(ph)*.05+e.dirx*.03;sy=1+(.5-s)*.05;sx=1-(.5-s)*.04;}
    else{oy=-s*4.2;rot=Math.sin(ph)*.075+e.dirx*.05;sy=1+(s-.5)*.06;sx=1-(s-.5)*.05;}
  }
  const sh=e.frozen?'rgba(150,230,255,.7)':(e.slowT>0?'rgba(120,200,255,.55)':(e.burnT>0?'rgba(255,140,40,.55)':'rgba(0,0,0,'+shA+')'));
  ctx.fillStyle=sh;ctx.beginPath();ctx.ellipse(e.x,e.y+11,f.w*.38*shS,5*shS,0,0,7);ctx.fill();
  const isC=e.tier==='cmd'||e.tier==='boss';
  if(isC){const A=ABIL[e.abs[0]];ctx.strokeStyle=hexA(A.col,.55+.25*Math.sin(time*4));ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(e.x,e.y+11,f.w*.5,f.w*.2,0,0,7);ctx.stroke();}

  if(e.castT>0){ctx.globalCompositeOperation='lighter';glow(e.x,e.y-f.h*.4,f.w*.8,ABIL[e.abs[0]].col,.6*e.castT/.45);ctx.globalCompositeOperation='source-over';}
  if(e.chargeT>0){ctx.globalCompositeOperation='lighter';glow(e.x,e.y-f.h*.3,f.w*.7,'#ff5a4a',.4);ctx.globalCompositeOperation='source-over';}
  ctx.save();ctx.translate(e.x,e.y+13+oy);ctx.rotate(rot);ctx.scale(sx,sy);
  if(e.flash>0)drawTinted(e.img,-f.w/2,-f.h,f.w,f.h,'#ffffff',.75);
  else if(e.frozen)drawTinted(e.img,-f.w/2,-f.h,f.w,f.h,'#7fe0ff',.6);
  else if(e.burnT>0)drawTinted(e.img,-f.w/2,-f.h,f.w,f.h,'#ff6a10',.28+.12*Math.sin(time*20));
  else if(e.slowT>0)drawTinted(e.img,-f.w/2,-f.h,f.w,f.h,'#4fb0ff',.3);
  else ctx.drawImage(e.img,-f.w/2,-f.h,f.w,f.h);
  ctx.restore();
  if(e.shield>0){ctx.fillStyle='rgba(107,181,255,.16)';ctx.strokeStyle='rgba(140,200,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(e.x,e.y+13-f.h*.45,f.w*.58,f.h*.55,0,0,7);ctx.fill();ctx.stroke();}
  if(e.stunT>0&&!e.frozen){ctx.fillStyle='#ffe95a';ctx.font='10px system-ui';ctx.textAlign='center';for(let i=0;i<3;i++){const a=time*8+i*2.1;ctx.fillText('★',e.x+Math.cos(a)*10,e.y+13-f.h+Math.sin(a)*3);}}
  const top=e.y+13-f.h+oy,bw=Math.max(22,f.w*(isC?.95:.8)),bx=e.x-bw/2,by=top-(isC?9:6),bh=isC?5:3;
  ctx.fillStyle='#000a';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  const hf=Math.max(0,e.hp/e.max);ctx.fillStyle=hf>.5?'#5be35b':(hf>.25?'#ffc233':'#ff4d4d');ctx.fillRect(bx,by,bw*hf,bh);
  if(e.shield>0){ctx.fillStyle='#6bb5ff';ctx.fillRect(bx,by-2,bw*Math.min(1,e.shield/(S.cfg.hp*2.5)),2);}
  if(isC){
    const A=ABIL[e.abs[0]];ctx.fillStyle='#000c';ctx.beginPath();ctx.arc(bx-6,by+2,7,0,7);ctx.fill();
    ctx.strokeStyle=A.col;ctx.lineWidth=1.5;ctx.stroke();ctx.font='9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(A.e,bx-6,by+2.5);ctx.textBaseline='alphabetic';
  }
}

/* ---------- Talks to the app (GameVo Mine) ----------
   The game itself shows NO ads and gives NO reward. When a stage is cleared it only tells the app ("bd:win");
   the app plays the ad and the server pays the reward. */
function notifyParent(m){try{window.parent.postMessage(m,window.location.origin);}catch(e){}}
$('claimBtn').onclick=()=>notifyParent({type:'bd:win',level});
$('retryBtn').onclick=startLevel;
$('bExit').onclick=()=>notifyParent({type:'bd:exit'});
function refreshSnd(){const st=SFX.state();$('bSfx').textContent=st.sfx?'🔊':'🔇';$('bMus').textContent=st.mus?'🎵':'🔕';$('bSfx').classList.toggle('on',st.sfx);$('bMus').classList.toggle('on',st.mus);}
$('bSfx').onclick=()=>{SFX.resume();SFX.toggleSfx();SFX.play('click');refreshSnd();};
$('bMus').onclick=()=>{SFX.resume();SFX.toggleMus();refreshSnd();};
if(document.addEventListener)document.addEventListener('pointerdown',()=>SFX.resume());
refreshSnd();

/* ---------- boot ---------- */
loadAll().then(()=>{
  setupMap(level);buildBG(level);applyTheme();fitStage();renderShop();updateHud();clampCam();
  $('loading').style.display='none';
  requestAnimationFrame(loop);
  startLevel();   // the app's Play button already started the run, so there is no start screen here
});

</script>
