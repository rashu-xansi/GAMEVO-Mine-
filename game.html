<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Surf Adventure</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0a1c2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 800px;
            background: #0e5a8a;
            border: 4px solid #06283d;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .hud {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
        }

        .stats {
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 #06283d;
            background: rgba(0,0,0,0.25);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 14px;
        }
        .hearts { color: #ff3b3b; font-size: 18px; text-shadow: 1px 1px 0 #06283d; }
        .level { color: #baffea; font-size: 11px; text-shadow: 1px 1px 0 #06283d; background: rgba(0,0,0,0.25); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
        .coins { color: #bfe9ff; font-size: 11px; text-shadow: 1px 1px 0 #06283d; background: rgba(0,0,0,0.25); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

        .controls {
            position: absolute;
            bottom: 22px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 20;
        }

        .jump-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffe680, #ffb830 70%);
            border: 3px solid #06283d;
            font-weight: bold;
            font-size: 13px;
            color: #4a2e00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.35);
            transition: transform 0.05s;
            touch-action: none;
        }

        .jump-btn:active { transform: scale(0.9) translateY(3px); box-shadow: none; }
        .jump-btn span { font-size: 26px; line-height: 1; }

        #back-btn {
            position: absolute;
            top: 50px;
            left: 10px;
            background: rgba(255,255,255,0.9);
            border: 2px solid #06283d;
            border-radius: 6px;
            padding: 5px 8px;
            cursor: pointer;
            z-index: 30;
            font-size: 12px;
            font-weight: bold;
        }

        #game-over {
            position: absolute;
            inset: 0;
            background: rgba(3, 15, 26, 0.88);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            text-align: center;
        }
        #game-over h1 { color: #ff5555; text-shadow: 2px 2px 0 #000; letter-spacing: 2px; }
        #game-over button {
            padding: 10px 24px;
            margin-top: 12px;
            background: #ffe600;
            border: 3px solid #06283d;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        /* ⚠️ NEW — secondary action on the game-over screen. The pixel
           "⬅ BACK" button (#back-btn) still exists at top-left, but
           #game-over sits at z-index:100 above it (#back-btn is z-index:30),
           so it's visually/click-wise buried underneath the moment a run
           ends — there was effectively no way back to the mini app without
           force-closing Telegram. This button lives *inside* #game-over
           itself so it's always reachable after a run. */
        #game-over button.secondary {
            background: transparent;
            color: #fff;
            border-color: #fff;
        }

        #warn {
            position: absolute;
            top: 90px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 13px;
            text-shadow: 2px 2px 0 #000;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #next-biome {
            position: absolute;
            top: 34px;
            left: 50%;
            transform: translateX(-50%);
            color: #072033;
            background: rgba(255, 230, 80, 0.92);
            padding: 4px 12px;
            border-radius: 20px;
            border: 2px solid #06283d;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 16;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="back-btn" onclick="exitToApp()">⬅ BACK</div>

    <div class="hud">
        <div class="hearts" id="lives">❤️❤️❤️</div>
        <div class="stats" id="dist">0m</div>
        <div class="coins" id="coins">💧 0.0000</div>
        <div class="level" id="lvl">Zone 1</div>
    </div>

    <div id="warn"></div>
    <div id="next-biome"></div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div class="jump-btn" id="jump-btn"><span>⬆️</span>JUMP</div>
    </div>

    <div id="game-over">
        <h1>WIPED OUT!</h1>
        <p>Distance: <span id="final-dist">0</span>m</p>
        <p>Drops collected: <span id="final-coins">💧 0.0000</span></p>
        <button onclick="resetGame()">REPLAY</button>
        <button class="secondary" onclick="exitToApp()">⬅ BACK TO APP</button>
    </div>
</div>

    function drawSky(phase) {

        haze.addColorStop(1, `rgba(${waterTopRGB},0)`);
        ctx.fillStyle = haze;
        ctx.fillRect(0, HORIZON_Y - hazeSpan, GAME_W, hazeSpan * 2);
        // a faint bright waterline right at the seam itself (like real sea-glare)
        ctx.globalAlpha = phase.isNight ? 0.18 : 0.35;
        const glintGrad = ctx.createLinearGradient(0, HORIZON_Y - 2, 0, HORIZON_Y + 5);
        glintGrad.addColorStop(0, 'rgba(255,255,255,0)');
        glintGrad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
        glintGrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glintGrad;
        ctx.fillRect(0, HORIZON_Y - 2, GAME_W, 7);
        ctx.globalAlpha = 1;
        ctx.restore();
    }

    // ---------- Weather: storms act like a moving hazard ----------
    const STORM_CYCLE = 240; // meters between storms
    const STORM_LEN = 40;    // meters the storm actually lasts
    const STORM_WARN = 28;   // meters of advance warning
    function stormInfo() {
        const cyclePos = ((distance % STORM_CYCLE) + STORM_CYCLE) % STORM_CYCLE;
        const stormStart = STORM_CYCLE - STORM_LEN;
        if (cyclePos >= stormStart) {
            const p = (cyclePos - stormStart) / STORM_LEN;
            return { active: true, warning: false, intensity: Math.sin(p * Math.PI), cycleIndex: Math.floor(distance / STORM_CYCLE) };
        }
        if (cyclePos >= stormStart - STORM_WARN) {
            const p = (cyclePos - (stormStart - STORM_WARN)) / STORM_WARN;
            return { active: false, warning: true, eta: p, cycleIndex: Math.floor(distance / STORM_CYCLE) };
        }
        return { active: false, warning: false, intensity: 0, cycleIndex: Math.floor(distance / STORM_CYCLE) };
    }

    // ---------- Endless biome system ----------
    // The world endlessly cycles: open ocean -> mountain pass (canyon) -> jungle river -> ocean ...
    // Each full cycle it gets a little tighter/tougher, forever.
    const BIOME_ORDER = ['ocean', 'canyon', 'jungle'];
    const SEGMENT_LEN = 240; // meters per biome segment — longer = fewer, calmer transitions
    const BIOME_NAME = { ocean: 'Open Ocean', canyon: 'Mountain Pass', jungle: 'Jungle River' };

    function bandParams(biome, loop) {
        if (biome === 'canyon') {
            // straight, steady banks — a very gentle drift instead of a hard zig-zag
            return { halfGap: Math.max(58, 90 - loop * 1.6), amp: 9, freq: 0.004, center: GAME_W / 2, biome };
        }
        if (biome === 'jungle') {
            return { halfGap: Math.max(78, 108 - loop * 1.2), amp: 6, freq: 0.003, center: GAME_W / 2, biome };
        }
        return { halfGap: 900, amp: 0, freq: 0, center: GAME_W / 2, biome: 'ocean' }; // open water, effectively no walls
    }

    function segmentInfo(segIndex) {
        const idx = ((segIndex % 3) + 3) % 3;
        const biome = BIOME_ORDER[idx];
        const loop = Math.floor(segIndex / 3);
        return bandParams(biome, Math.max(0, loop));
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function smoothstep(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

    // Only the entrance of each segment blends in from the previous one — this is the single
    // source of truth for the shape, so there is no double-blending / sudden pop at boundaries.
    function currentBand() {
        const segF = distance / SEGMENT_LEN;
        const segIndex = Math.floor(segF);
        const progress = segF - segIndex;
        const cur = segmentInfo(segIndex);
        const T = 0.3; // fraction of the segment spent easing in from the previous shape
        let out = { halfGap: cur.halfGap, amp: cur.amp, freq: cur.freq, center: cur.center, biome: cur.biome };
        if (progress < T && segIndex > 0) {
            const prev = segmentInfo(segIndex - 1);
            const t = smoothstep(progress / T);
            out.halfGap = lerp(prev.halfGap, cur.halfGap, t);
            out.amp = lerp(prev.amp, cur.amp, t);
            out.freq = lerp(prev.freq, cur.freq, t);
        }
        out.bounded = out.halfGap < 400;

        // advance notice for the HUD arrow: what's coming, and how soon (0 = far away, 1 = arriving)
        const NOTICE = 0.32;
        if (progress > 1 - NOTICE) {
            const next = segmentInfo(segIndex + 1);
            out.upcoming = next.biome;
            out.upcomingEta = smoothstep((progress - (1 - NOTICE)) / NOTICE);
        } else {
            out.upcoming = null;
            out.upcomingEta = 0;
        }
        return out;
    }

    function bandLeft(band, y) {
        return band.center - band.halfGap + Math.sin((worldScroll - y) * band.freq) * band.amp;
    }
    function bandRight(band, y) {
        return band.center + band.halfGap + Math.sin((worldScroll - y) * band.freq) * band.amp;
    }

    let decos = []; // trees / rock spikes hugging the banks
    let lastBiomeShown = 'ocean';
    let nextGauntletAt = 180; // distance (m) at which the next jump-gauntlet triggers

    function spawnJumpGauntlet(band) {
        // Just a single jump-only barrier — no more long chains of them
        obstacles.push(new Obstacle('jumpWall', band, -60));
    }

    function spawnDecorations(band) {
        if (!band.bounded) return;
        const rate = band.biome === 'jungle' ? 26 : 30;
        if (frame % rate !== 0) return;
        ['left', 'right'].forEach(side => {
            decos.push({
                side,
                y: -30,
                biome: band.biome,
                inset: 6 + Math.random() * 20,
                scale: 0.75 + Math.random() * 0.6,
                sway: Math.random() * Math.PI * 2
            });
        });
    }

    function updateAndDrawDecorations(band) {
        decos.forEach((d, i) => {
            d.y += speed;
            const b = band; // use current band shape (good enough visually, avoids per-object recompute cost)
            const l = bandLeft(b, d.y);
            const r = bandRight(b, d.y);
            const x = d.side === 'left' ? l - d.inset : r + d.inset;
            drawDecoration(x, d.y, d);
            if (d.y > GAME_H + 40) decos.splice(i, 1);
        });
    }

    function drawDecoration(x, y, d) {
        ctx.save();
        ctx.translate(x, y);
        const s = d.scale;
        if (d.biome === 'canyon') {
            // jagged rock spike
            ctx.fillStyle = '#6b6559';
            ctx.beginPath();
            ctx.moveTo(-10 * s, 10 * s);
            ctx.lineTo(-4 * s, -16 * s);
            ctx.lineTo(3 * s, -22 * s);
            ctx.lineTo(9 * s, -6 * s);
            ctx.lineTo(12 * s, 10 * s);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#8a8375';
            ctx.beginPath();
            ctx.moveTo(-4 * s, -16 * s);
            ctx.lineTo(3 * s, -22 * s);
            ctx.lineTo(4 * s, -4 * s);
            ctx.lineTo(-3 * s, -2 * s);
            ctx.closePath();
            ctx.fill();
        } else {
            // palm-ish tree: trunk + fronds
            const sway = Math.sin(time * 0.05 + d.sway) * 3 * s;
            ctx.strokeStyle = '#5b3a22';
            ctx.lineWidth = 3 * s;
            ctx.beginPath();
            ctx.moveTo(0, 14 * s);
            ctx.quadraticCurveTo(sway * 0.4, -4 * s, sway, -20 * s);
            ctx.stroke();
            ctx.fillStyle = '#2f7d3a';
            [[-1, -0.4], [1, -0.5], [0, -1], [-0.6, -0.9], [0.7, -1]].forEach(([dx, dy]) => {
                ctx.beginPath();
                ctx.ellipse(sway + dx * 12 * s, -20 * s + dy * 10 * s, 9 * s, 5 * s, dx * 0.6, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.fillStyle = '#3d9a4a';
            ctx.beginPath();
            ctx.ellipse(sway, -22 * s, 7 * s, 4 * s, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawEnvironment(band) {
        if (!band.bounded) return; // open ocean: nothing to draw, just water
        const step = 8;
        let leftPts = [], rightPts = [];
        for (let y = -20; y <= GAME_H + 20; y += step) {
            leftPts.push({ x: bandLeft(band, y), y });
            rightPts.push({ x: bandRight(band, y), y });
        }

        const isCanyon = band.biome === 'canyon';
        ctx.save();

        // left mass
        ctx.beginPath();
        ctx.moveTo(-20, -20);
        leftPts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(-20, GAME_H + 20);
        ctx.closePath();
        let g1 = ctx.createLinearGradient(0, 0, GAME_W, 0);
        if (isCanyon) { g1.addColorStop(0, '#4a453c'); g1.addColorStop(1, '#847c6c'); }
        else { g1.addColorStop(0, '#3f6b2e'); g1.addColorStop(1, '#6ba24a'); }
        ctx.fillStyle = g1;
        ctx.fill();

        // right mass
        ctx.beginPath();
        ctx.moveTo(GAME_W + 20, -20);
        rightPts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(GAME_W + 20, GAME_H + 20);
        ctx.closePath();
        let g2 = ctx.createLinearGradient(0, 0, GAME_W, 0);
        if (isCanyon) { g2.addColorStop(0, '#847c6c'); g2.addColorStop(1, '#4a453c'); }
        else { g2.addColorStop(0, '#6ba24a'); g2.addColorStop(1, '#3f6b2e'); }
        ctx.fillStyle = g2;
        ctx.fill();

        // waterline foam along both edges
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        leftPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.stroke();
        ctx.beginPath();
        rightPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.stroke();

        ctx.restore();

        spawnDecorations(band);
        updateAndDrawDecorations(band);
    }

    function checkBankCollision(band) {
        if (!band.bounded) return;
        const px = player.x + player.pulled;
        const l = bandLeft(band, player.y) + player.w * 0.32;
        const r = bandRight(band, player.y) - player.w * 0.32;
        if (px < l || px > r) {
            if (shieldTime > 0) {
                player.pulled += px < l ? 2.5 : -2.5; // shield: just nudge back, no damage
            } else if (invuln <= 0) {
                lives--;
                invuln = 45;
                spawnSplash(px, player.y, 12);
                player.pulled += px < l ? 22 : -22; // bounce back toward the channel
                updateHUD();
                if (lives <= 0) gameOver();
            } else {
                player.pulled += px < l ? 2.5 : -2.5;
            }
        }
    }

    const player = {
        x: GAME_W / 2,
        y: GAME_H - 130,
        w: 34,
        h: 48,
        targetX: GAME_W / 2,
        z: 0,
        jumpV: 0,
        tilt: 0,
        pulled: 0 // extra x-offset applied by whirlpool pull
    };

    let obstacles = [];
    let particles = [];
    let bursts = []; // one-shot splash-sprite bursts on big impacts
    let caustics = Array.from({ length: 7 }, () => ({
        x: Math.random() * GAME_W, y: Math.random() * GAME_H,
        r: 30 + Math.random() * 40, phase: Math.random() * Math.PI * 2, sp: 0.4 + Math.random() * 0.5
    }));
    let foam = [];
    let bgStones = []; // decorative scattered stones, purely visual

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function jump() {
        if (player.z === 0) {
            player.jumpV = 9;
            spawnSplash(player.x, player.y + 18, 8);
        }
    }

    function updateHUD() {
        document.getElementById('lives').innerText = "❤️".repeat(Math.max(0, lives));
        document.getElementById('dist').innerText = Math.floor(distance) + "m";
        document.getElementById('coins').innerText = '💧 ' + coins.toFixed(4);
        const b = currentBand();
        document.getElementById('lvl').innerText = (BIOME_NAME[b.biome] || "Zone " + zone);
        updateNextBiomeSign(b, stormInfo());
    }

    function updateNextBiomeSign(b, storm) {
        const el = document.getElementById('next-biome');
        if (storm && storm.warning) {
            el.style.opacity = Math.min(1, storm.eta * 1.4);
            el.innerHTML = "⛈ STORM AHEAD";
        } else if (b.upcoming && b.upcomingEta > 0.05) {
            el.style.opacity = Math.min(1, b.upcomingEta * 1.4);
            el.innerHTML = "AHEAD &raquo; " + (BIOME_NAME[b.upcoming] || '');
        } else {
            el.style.opacity = 0;
        }
    }

    function showWarn(msg) {
        const el = document.getElementById('warn');
        el.innerText = msg;
        el.style.opacity = 1;
        clearTimeout(showWarn._t);
        showWarn._t = setTimeout(() => { el.style.opacity = 0; }, 1800);
    }

    function spawnSplash(x, y, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x + (Math.random() - 0.5) * 20,
                y: y + (Math.random() - 0.5) * 6,
                vx: (Math.random() - 0.5) * 3,
                vy: -Math.random() * 3 - 1,
                life: 20 + Math.random() * 10,
                size: 2 + Math.random() * 2,
                rot: Math.random() * Math.PI * 2
            });
        }
        // a quick radial splash burst sprite for extra "real water" feel on bigger hits
        if (count >= 8) {
            bursts.push({ x, y, life: 14, maxLife: 14 });
        }
    }

    // ---------- Difficulty curve ----------
    // Distance thresholds unlock new hazards and ramp everything up gradually.
    function currentZone() {
        if (distance > 400) return 4;
        if (distance > 220) return 3;
        if (distance > 90) return 2;
        return 1;
    }
    // Every 500m is a new milestone tier: fresh hazards, a bit more speed, and power-ups unlock.
    function currentTier() { return Math.floor(distance / 500); }
    let creaturesUnlocked = false;
    let whirlpoolsUnlocked = false;
    let sharksUnlocked = false;   // tier 1 (500m+)
    let powerupsUnlocked = false; // tier 1 (500m+)
    let doubleMinesUnlocked = false; // tier 2 (1000m+)

    // ---------- Obstacles ----------
    class Obstacle {
        constructor(forcedType, band, startY) {
            this.type = forcedType || pickType(band);
            this.y = (startY !== undefined) ? startY : -60;
            if (this.type === 'jumpWall') {
                // spans the whole navigable lane — no sideways dodge, must jump
                const l = (band && band.bounded) ? bandLeft(band, this.y) + 14 : 14;
                const r = (band && band.bounded) ? bandRight(band, this.y) - 14 : GAME_W - 14;
                this.x = l;
                this.w = Math.max(30, r - l);
                this.h = 16;
                this.speed = speed;
                this.wobble = Math.random() * Math.PI * 2;
                // visual variety: plain plank, broken/cracked wood, or a fallen leafy tree
                const styles = ['plank', 'plank', 'broken', 'tree'];
                this.style = styles[Math.floor(Math.random() * styles.length)];
                return;
            }
            if (band && band.bounded) {
                const l = bandLeft(band, this.y) + 22;
                const r = bandRight(band, this.y) - 22;
                const span = Math.max(10, r - l);
                this.x = l + Math.random() * span;
            } else {
                this.x = 25 + Math.random() * (GAME_W - 70);
            }
            this.wobble = Math.random() * Math.PI * 2;

            if (this.type === 'rock') {
                this.w = 34; this.h = 20;
                this.speed = speed;
            } else if (this.type === 'creature') {
                this.w = 30; this.h = 16;
                this.speed = speed + 1.4;
                this.dir = Math.random() > 0.5 ? 1 : -1;
                this.baseX = this.x;
            } else if (this.type === 'whirlpool') {
                this.w = 46; this.h = 46;
                this.speed = speed * 0.6;
                this.pullRadius = 60;
            } else if (this.type === 'mine') {
                this.w = 32; this.h = 44;
                this.speed = speed * 0.85;
                this.baseX = this.x;
            } else if (this.type === 'piling') {
                this.w = 22; this.h = 70;
                this.speed = speed * 0.7; // stationary-feeling, juts up from the riverbed
            } else if (this.type === 'brokenPiling') {
                this.w = 42; this.h = 48;
                this.speed = speed * 0.7;
            } else if (this.type === 'floatingLog') {
                this.w = 54; this.h = 32;
                this.speed = speed + 0.6;
                this.baseX = this.x;
                this.driftAmp = 18 + Math.random() * 14;
            } else if (this.type === 'clamTrap') {
                this.w = 52; this.h = 40;
                this.speed = speed * 0.8;
                this.openAt = 60 + Math.random() * 40; // frames of life before it snaps open
                this.age = 0;
                this.open = false;
            } else if (this.type === 'jelly') {
                this.w = 28; this.h = 22;
                this.speed = speed + 0.5;
                this.baseX = this.x;
                this.hue = Math.random() > 0.5 ? '#8a5fd6' : '#3fd6c8';
            } else if (this.type === 'nightEyes') {
                this.w = 30; this.h = 14;
                this.speed = speed * 0.9;
                this.baseX = this.x;
            } else if (this.type === 'shark') {
                this.w = 42; this.h = 20;
                this.speed = speed + 2.6; // fast — reacting late is costly
                this.dir = Math.random() > 0.5 ? 1 : -1;
                this.baseX = this.x;
            } else if (this.type === 'doubleMine') {
                this.w = 62; this.h = 44;
                this.speed = speed * 0.85;
                this.baseX = this.x;
            }
        }

        draw() {
            this.wobble += 0.08;
            const bobY = Math.sin(this.wobble) * 2;

            if (this.type === 'rock') {
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(this.x + 17, this.y + 26, 18, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                drawPixelRect(this.x, this.y + bobY, 34, 18, '#5b5b5b');
                drawPixelRect(this.x + 4, this.y - 6 + bobY, 22, 8, '#767676');
                drawPixelRect(this.x + 8, this.y - 10 + bobY, 10, 5, '#8c8c8c');
                drawPixelRect(this.x + 2, this.y + 12 + bobY, 30, 4, '#3f3f3f');
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillRect(this.x - 2, this.y + 16 + bobY, 38, 3);

            } else if (this.type === 'creature') {
                // Animated swimming fish/eel, oscillates side to side as it moves down
                this.x = this.baseX + Math.sin(this.wobble * 1.5) * 22;
                const swim = Math.sin(time * 0.3 + this.wobble) * 4;

                // faint underwater glow so it reads as "beneath the surface"
                ctx.save();
                ctx.globalAlpha = 0.25;
                ctx.fillStyle = '#7CFC00';
                ctx.beginPath();
                ctx.ellipse(this.x + 15, this.y + 8, 24, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.globalAlpha = 0.8;
                // body
                ctx.fillStyle = '#4a8f3c';
                ctx.beginPath();
                ctx.ellipse(this.x + 15, this.y + 8, 13, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                // animated tail (wags)
                ctx.beginPath();
                ctx.moveTo(this.x + 2, this.y + 8);
                ctx.lineTo(this.x - 8, this.y + 8 - swim);
                ctx.lineTo(this.x - 8, this.y + 8 + swim);
                ctx.closePath();
                ctx.fill();
                // eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x + 24, this.y + 6, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

            } else if (this.type === 'whirlpool') {
                ctx.save();
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
                ctx.rotate(this.wobble * 1.5);
                if (assetsReady.whirlImg) {
                    ctx.drawImage(whirlImg, -this.w / 2, -this.h / 2, this.w, this.h);
                } else {
                    for (let r = 20; r > 2; r -= 5) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(10,40,60,${0.15 + (20 - r) / 40})`;
                        ctx.lineWidth = 3;
                        ctx.arc(0, 0, r, r * 0.3, r * 0.3 + 4.5);
                        ctx.stroke();
                    }
                }
                ctx.restore();

            } else if (this.type === 'mine') {
                // gently bobs in place, does NOT clear with a jump — must be dodged sideways
                this.x = this.baseX + Math.sin(this.wobble * 0.7) * 4;
                ctx.save();
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.ellipse(this.x + this.w / 2, this.y + this.h - 4, this.w * 0.45, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                if (assetsReady.mineImg) {
                    ctx.drawImage(mineImg, this.x, this.y + bobY, this.w, this.h);
                } else {
                    drawPixelRect(this.x, this.y + bobY, this.w, this.h, '#4a5a52');
                }

            } else if (this.type === 'piling') {
                if (assetsReady.pilingImg) {
                    ctx.drawImage(pilingImg, this.x, this.y, this.w, this.h);
                } else {
                    drawPixelRect(this.x, this.y, this.w, this.h, '#5b4a36');
                }

            } else if (this.type === 'brokenPiling') {
                if (assetsReady.brokenPilingImg) {
                    ctx.drawImage(brokenPilingImg, this.x, this.y, this.w, this.h);
                } else {
                    drawPixelRect(this.x, this.y, this.w, this.h, '#4a3d2e');
                }

            } else if (this.type === 'floatingLog') {
                this.x = this.baseX + Math.sin(this.wobble * 0.5) * this.driftAmp;
                ctx.save();
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2 + bobY);
                ctx.rotate(this.wobble * 0.4);
                if (assetsReady.floatingLogImg) {
                    ctx.drawImage(floatingLogImg, -this.w / 2, -this.h / 2, this.w, this.h);
                } else {
                    ctx.fillStyle = '#6b4a2e';
                    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                }
                ctx.restore();

            } else if (this.type === 'clamTrap') {
                this.age++;
                if (!this.open && this.age > this.openAt) this.open = true;
                const img = this.open ? clamOpenImg : clamClosedImg;
                const ready = this.open ? assetsReady.clamOpenImg : assetsReady.clamClosedImg;
                if (ready) {
                    ctx.drawImage(img, this.x, this.y, this.w, this.h);
                } else {
                    drawPixelRect(this.x, this.y, this.w, this.h, this.open ? '#333' : '#3f5049');
                }
                if (!this.open && this.openAt - this.age < 25) {
                    // subtle warning shudder just before it snaps open
                    ctx.save();
                    ctx.globalAlpha = 0.4 * Math.sin(this.age * 0.9);
                    ctx.strokeStyle = '#ffdd55';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(this.x - 2, this.y - 2, this.w + 4, this.h + 4);
                    ctx.restore();
                }

            } else if (this.type === 'jelly') {
                // night-only bioluminescent jellyfish, drifts and pulses with a soft glow
                this.x = this.baseX + Math.sin(this.wobble * 1.1) * 16;
                const pulse = 0.5 + Math.sin(time * 0.1 + this.wobble) * 0.3;
                ctx.save();
                ctx.globalAlpha = 0.35 * pulse;
                ctx.fillStyle = this.hue;
                ctx.beginPath();
                ctx.arc(this.x + this.w / 2, this.y + this.h / 2, this.w * 0.9, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                ctx.save();
                ctx.globalAlpha = 0.85;
                ctx.fillStyle = this.hue;
                ctx.beginPath();
                ctx.arc(this.x + this.w / 2, this.y + this.h / 2 - 2, this.w / 2, Math.PI, 0);
                ctx.fill();
                for (let i = 0; i < 4; i++) {
                    const tx = this.x + 6 + i * 6;
                    ctx.beginPath();
                    ctx.moveTo(tx, this.y + this.h / 2);
                    ctx.quadraticCurveTo(tx + Math.sin(this.wobble + i) * 4, this.y + this.h + 4, tx, this.y + this.h + 8);
                    ctx.strokeStyle = this.hue;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
                ctx.restore();

            } else if (this.type === 'nightEyes') {
                // a pair of glowing eyes lurking just beneath the dark water — dodge sideways
                this.x = this.baseX + Math.sin(this.wobble * 0.6) * 6;
                const blink = Math.sin(time * 0.08 + this.wobble) > -0.85;
                ctx.save();
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = '#1a0000';
                ctx.beginPath();
                ctx.ellipse(this.x + this.w / 2, this.y + this.h / 2, this.w * 0.7, this.h * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                if (blink) {
                    ctx.save();
                    ctx.shadowColor = '#ff3030';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = '#ff4040';
                    ctx.beginPath();
                    ctx.ellipse(this.x + 7, this.y + 7, 3.5, 2.2, 0, 0, Math.PI * 2);
                    ctx.ellipse(this.x + this.w - 7, this.y + 7, 3.5, 2.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

            } else if (this.type === 'shark') {
                // fast, aggressive — a 500m-milestone hazard that demands a quick reaction
                this.x = this.baseX + Math.sin(this.wobble * 2.2) * 14;
                ctx.save();
                ctx.globalAlpha = 0.85;
                ctx.fillStyle = '#5b6b74';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + 10);
                ctx.quadraticCurveTo(this.x + this.w * 0.4, this.y, this.x + this.w, this.y + 8);
                ctx.quadraticCurveTo(this.x + this.w * 0.4, this.y + 20, this.x, this.y + 10);
                ctx.closePath();
                ctx.fill();
                // dorsal fin
                ctx.beginPath();
                ctx.moveTo(this.x + this.w * 0.35, this.y + 2);
                ctx.lineTo(this.x + this.w * 0.48, this.y - 9);
                ctx.lineTo(this.x + this.w * 0.58, this.y + 3);
                ctx.closePath();
                ctx.fill();
                // eye
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.x + this.w - 9, this.y + 8, 1.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

            } else if (this.type === 'doubleMine') {
                const gap = 30;
                [-gap / 2, gap / 2].forEach(off => {
                    const mx = this.x + this.w / 2 + off - 16;
                    ctx.save();
                    ctx.globalAlpha = 0.2;
                    ctx.fillStyle = '#0a0a0a';
                    ctx.beginPath();
                    ctx.ellipse(mx + 16, this.y + this.h - 4, 15, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    if (assetsReady.mineImg) {
                        ctx.drawImage(mineImg, mx, this.y + bobY, 32, 40);
                    } else {
                        drawPixelRect(mx, this.y + bobY, 32, 40, '#4a5a52');
                    }
                });

            } else if (this.type === 'jumpWall') {
                // a low barrier spanning the whole lane — the only way through is up and over
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(this.x + this.w / 2, this.y + this.h + 6, this.w / 2, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (this.style === 'broken') {
                    // cracked, jagged wood — darker and rougher than a plain plank
                    const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h + 6);
                    grad.addColorStop(0, '#6b5540');
                    grad.addColorStop(1, '#3a2c1e');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + 4 + bobY);
                    for (let sx = this.x; sx <= this.x + this.w; sx += 12) {
                        const jag = Math.sin(sx * 1.7 + this.wobble) * 5;
                        ctx.lineTo(sx, this.y + bobY + this.h * 0.4 + jag);
                    }
                    ctx.lineTo(this.x + this.w, this.y + this.h + bobY);
                    ctx.lineTo(this.x, this.y + this.h + bobY);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                    ctx.lineWidth = 1;
                    for (let sx = this.x + 10; sx < this.x + this.w; sx += 18) {
                        ctx.beginPath();
                        ctx.moveTo(sx, this.y + bobY + 4);
                        ctx.lineTo(sx - 3, this.y + bobY + this.h);
                        ctx.stroke();
                    }
                } else if (this.style === 'tree') {
                    // a fallen leafy tree trunk across the water
                    if (assetsReady.floatingLogImg) {
                        const segW = 46;
                        for (let sx = this.x; sx < this.x + this.w; sx += segW - 4) {
                            const w = Math.min(segW, this.x + this.w - sx);
                            ctx.drawImage(floatingLogImg, sx, this.y + bobY - 4, w, this.h + 10);
                        }
                    } else {
                        ctx.fillStyle = '#6b4a2e';
                        ctx.fillRect(this.x, this.y + bobY, this.w, this.h);
                    }
                    // leafy tufts sprouting along the trunk
                    for (let sx = this.x + 10; sx < this.x + this.w; sx += 26) {
                        ctx.fillStyle = '#2f7d3a';
                        ctx.beginPath();
                        ctx.ellipse(sx, this.y + bobY - 6, 9, 6, 0.3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#3d9a4a';
                        ctx.beginPath();
                        ctx.ellipse(sx + 4, this.y + bobY - 9, 6, 4, -0.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    // plain wooden plank
                    const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
                    grad.addColorStop(0, '#8a6a44');
                    grad.addColorStop(1, '#5c4429');
                    ctx.fillStyle = grad;
                    ctx.fillRect(this.x, this.y + bobY, this.w, this.h);
                    ctx.fillStyle = 'rgba(255,255,255,0.55)';
                    ctx.fillRect(this.x, this.y + bobY, this.w, 3);
                    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                    ctx.lineWidth = 1;
                    for (let sx = this.x + 14; sx < this.x + this.w; sx += 22) {
                        ctx.beginPath();
                        ctx.moveTo(sx, this.y + bobY);
                        ctx.lineTo(sx, this.y + bobY + this.h);
                        ctx.stroke();
                    }
                }
            }
        }
    }

    function pickType(band, night) {
        const bounded = band && band.bounded;
        const options = ['rock', 'rock']; // rocks stay the most common, everything else is a sprinkle
        if (creaturesUnlocked) options.push(night ? 'jelly' : 'creature');
        if (whirlpoolsUnlocked && (!bounded || band.biome === 'jungle')) options.push('whirlpool');
        if (whirlpoolsUnlocked) {
            if (bounded && band.biome === 'canyon') options.push(night ? 'nightEyes' : 'mine', 'piling');
            if (bounded && band.biome === 'jungle') options.push('floatingLog', 'clamTrap');
            if (!bounded) options.push(night ? 'nightEyes' : 'mine');
        } else if (creaturesUnlocked) {
            if (bounded && band.biome === 'canyon') options.push('piling');
            if (bounded && band.biome === 'jungle') options.push('floatingLog');
        }
        // 500m milestone: a fast shark joins the mix
        if (sharksUnlocked) options.push('shark');
        // 1000m milestone: mines start coming in tight pairs
        if (doubleMinesUnlocked && !night) options.push('doubleMine');
        return options[Math.floor(Math.random() * options.length)];
    }

    function spawnObstacles(band, night) {
        // Fewer traps overall, and it eases up over a longer stretch so runs last a long time.
        // Each 500m milestone nudges the rate down a little further (small, steady difficulty bumps).
        const tier = currentTier();
        let rate = Math.max(34, 110 - Math.floor(distance / 60) - tier * 5);
        if (frame % rate === 0) {
            obstacles.push(new Obstacle(pickType(band, night), band));
        }
    }

    function checkCollision(obs) {
        const hitBox = player.x + player.pulled;
        if (hitBox + player.w * 0.3 < obs.x + obs.w && hitBox + player.w * 0.7 > obs.x &&
            player.y < obs.y + obs.h && player.y + player.h * 0.6 > obs.y) {

            if (obs.type === 'rock') {
                if (player.z > 10) return false; // jump over
                return true;
            }
            if (obs.type === 'creature') {
                if (player.z > 10) return false; // jump over the fish
                return true;
            }
            if (obs.type === 'whirlpool') {
                return player.z <= 4; // only jumping clears a whirlpool
            }
            if (obs.type === 'mine') {
                return true; // floating mine — must dodge sideways, jumping doesn't help
            }
            if (obs.type === 'piling' || obs.type === 'brokenPiling') {
                if (player.z > 12) return false; // tall enough to hop over
                return true;
            }
            if (obs.type === 'floatingLog') {
                if (player.z > 10) return false; // jump the log
                return true;
            }
            if (obs.type === 'clamTrap') {
                if (!obs.open) return false; // safe while closed
                return player.z <= 6; // open jaws — only a jump clears it
            }
            if (obs.type === 'jelly') {
                return player.z <= 8; // jump clears the jellyfish
            }
            if (obs.type === 'nightEyes') {
                return true; // lurking hazard — must dodge sideways, jump doesn't help
            }
            if (obs.type === 'shark') {
                return player.z <= 10; // fast, but a well-timed jump still clears it
            }
            if (obs.type === 'doubleMine') {
                return true; // twin mines — no clean gap to jump, must weave around them
            }
            if (obs.type === 'jumpWall') {
                if (player.z > 10) return false; // the only way through — jump it
                return true;
            }
        }
        return false;
    }

    function applyWhirlpoolPull() {
        player.pulled *= 0.9;
        obstacles.forEach(obs => {
            if (obs.type !== 'whirlpool') return;
            const cx = obs.x + obs.w / 2;
            const cy = obs.y + obs.h / 2;
            const dx = cx - player.x;
            const dy = cy - player.y;
            const dist2 = Math.sqrt(dx * dx + dy * dy);
            if (dist2 < obs.pullRadius && dist2 > 1 && player.z <= 4) {
                const pullStrength = (1 - dist2 / obs.pullRadius) * 1.8;
                player.pulled += (dx / dist2) * pullStrength;
                if (frame % 20 === 0) showWarn("Careful — whirlpool pulling you in!");
            }
        });
    }

    // ---------- Decorative stones scattered in the water ----------
    function initBgStones() {
        for (let i = 0; i < 10; i++) {
            bgStones.push({
                x: Math.random() * GAME_W,
                y: Math.random() * GAME_H,
                size: 4 + Math.random() * 6,
                speed: 0.6 + Math.random() * 0.4
            });
        }
    }

    function drawBgStones() {
        bgStones.forEach(s => {
            s.y += s.speed * (speed / 3);
            if (s.y > GAME_H + 10) { s.y = -10; s.x = Math.random() * GAME_W; }
            ctx.save();
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = '#33586e';
            ctx.beginPath();
            ctx.ellipse(s.x, s.y, s.size, s.size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    // ---------- Water rendering ----------
    function initFoam() {
        for (let i = 0; i < 18; i++) {
            foam.push({
                x: Math.random() * GAME_W,
                y: Math.random() * GAME_H,
                size: 10 + Math.random() * 20,
                speed: 0.5 + Math.random() * 0.8,
                alpha: 0.15 + Math.random() * 0.15
            });
        }
    }

    function drawWater() {
        // clipped to below the horizon — see HORIZON_Y / drawSky() above
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, HORIZON_Y, GAME_W, GAME_H - HORIZON_Y);
        ctx.clip();

        const grad = ctx.createLinearGradient(0, 0, 0, GAME_H);
        grad.addColorStop(0, '#0d7fb8');
        grad.addColorStop(0.5, '#1191c9');
        grad.addColorStop(1, '#0a6591');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        ctx.save();
        ctx.globalAlpha = 0.12;
        for (let i = 0; i < 6; i++) {
            const yBase = ((time * speed * 1.4 + i * 110) % (GAME_H + 100)) - 50;
            const grad2 = ctx.createLinearGradient(0, yBase, 0, yBase + 40);
            grad2.addColorStop(0, 'rgba(255,255,255,0)');
            grad2.addColorStop(0.5, 'rgba(255,255,255,0.6)');
            grad2.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad2;
            ctx.fillRect(0, yBase, GAME_W, 40);
        }
        ctx.restore();

        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.lineWidth = 2;
        const waveSpacing = 46;
        const scrollOffset = (time * speed * 2.2) % waveSpacing;
        for (let row = -1; row < GAME_H / waveSpacing + 1; row++) {
            const baseY = row * waveSpacing + scrollOffset;
            ctx.beginPath();
            for (let x = 0; x <= GAME_W; x += 6) {
                const y = baseY + Math.sin((x * 0.06) + time * 0.08 + row) * 4;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        drawBgStones();

        // Caustic light shimmer — soft drifting bright patches that give the water real depth
        ctx.save();
        ctx.globalCompositeOperation = 'lighten';
        caustics.forEach(c => {
            c.y += c.sp * (speed / 3.2);
            c.phase += 0.03;
            if (c.y > GAME_H + c.r) { c.y = -c.r; c.x = Math.random() * GAME_W; }
            const wob = Math.sin(c.phase) * 8;
            const a = 0.06 + Math.sin(c.phase * 1.7) * 0.03;
            const rg = ctx.createRadialGradient(c.x + wob, c.y, 0, c.x + wob, c.y, c.r);
            rg.addColorStop(0, `rgba(220,250,255,${a})`);
            rg.addColorStop(1, 'rgba(220,250,255,0)');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.ellipse(c.x + wob, c.y, c.r, c.r * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.restore();

        ctx.save();
        foam.forEach(f => {
            f.y += f.speed * (speed / 3);
            if (f.y > GAME_H + 20) { f.y = -20; f.x = Math.random() * GAME_W; }
            ctx.globalAlpha = f.alpha;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(f.x, f.y, f.size, f.size * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.restore();

        const vg = ctx.createRadialGradient(GAME_W/2, GAME_H/2, GAME_H/3, GAME_W/2, GAME_H/2, GAME_H/1.1);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,20,35,0.35)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, GAME_W, GAME_H);
        ctx.restore(); // pairs with the horizon clip at the top of this function
    }

    function drawParticles() {
        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15;
            p.life--;
            const alpha = Math.max(0, p.life / 25);
            if (assetsReady.waterDropImg) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(p.x, p.y);
                ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
                const s = p.size * 2.6;
                ctx.drawImage(waterDropImg, -s / 2, -s / 2, s, s);
                ctx.restore();
            } else {
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
            if (p.life <= 0) particles.splice(i, 1);
        });

        bursts.forEach((b, i) => {
            b.life--;
            const t = 1 - b.life / b.maxLife;
            const s = 18 + t * 26;
            if (assetsReady.splashImg) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, 1 - t) * 0.9;
                ctx.drawImage(splashImg, b.x - s / 2, b.y - s / 2, s, s);
                ctx.restore();
            }
            if (b.life <= 0) bursts.splice(i, 1);
        });
    }

    function drawPlayer() {
        const px = player.x + player.pulled;
        let drawY = player.y - player.z;
        const bob = Math.sin(time * 0.15) * (player.z === 0 ? 2 : 0);
        drawY += bob;

        const dx = player.targetX - player.x;
        player.tilt += ((dx * 0.03) - player.tilt) * 0.15;

        const shadowScale = Math.max(0.35, 1 - player.z / 60);
        ctx.save();
        ctx.globalAlpha = (invuln % 10 < 5 ? 0.25 : 0.08) * shadowScale;
        ctx.fillStyle = '#001a2b';
        ctx.beginPath();
        ctx.ellipse(px, player.y + 34, 20 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (shieldTime > 0) {
            ctx.save();
            const pulse = 0.5 + Math.sin(time * 0.3) * 0.25;
            ctx.globalAlpha = pulse;
            ctx.strokeStyle = '#9CFC5C';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#9CFC5C';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(px, drawY - 14, 26, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        if (frame % 3 === 0 && player.z < 4) {
            particles.push({
                x: px + (Math.random() - 0.5) * 14,
                y: player.y + 26,
                vx: (Math.random() - 0.5) * 1.5,
                vy: -0.5 - Math.random(),
                life: 14,
                size: 1.5 + Math.random()
            });
        }

        ctx.save();
        ctx.translate(px, drawY);
        ctx.rotate(player.tilt * 0.4);
        if (invuln > 0 && invuln % 10 < 5) ctx.globalAlpha = 0.4;

        ctx.fillStyle = '#f2f2f2';
        roundRect(-16, 20, 32, 8, 4);
        ctx.fill();
        ctx.fillStyle = '#e0e0e0';
        roundRect(-16, 20, 32, 3, 2);
        ctx.fill();

        const charW = player.w;
        const charH = player.h;
        if (charReady) {
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(charImg, -charW / 2, -charH + 6, charW, charH);
        } else {
            drawPixelRect(-6, -30, 12, 20, '#7fa8c9');
            drawPixelRect(-4, -38, 8, 10, '#3b2a1e');
        }
        ctx.globalAlpha = 1;
        ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function loop() {
        if (!gameActive) return;
        time++;

        // Difficulty progression
        const newZone = currentZone();
        if (newZone !== zone) {
            zone = newZone;
            if (zone === 2 && !creaturesUnlocked) { creaturesUnlocked = true; showWarn("Creatures spotted beneath the water!"); }
            if (zone === 3 && !whirlpoolsUnlocked) { whirlpoolsUnlocked = true; showWarn("Whirlpool traps ahead — jump to clear them!"); }
        }

        // Milestone tiers every 500m: new hazards, a power-up, and a small difficulty bump
        const tier = currentTier();
        if (tier >= 1 && !sharksUnlocked) { sharksUnlocked = true; showWarn("500m! Sharks are circling..."); }
        if (tier >= 1 && !powerupsUnlocked) { powerupsUnlocked = true; showWarn("Lightning shields washing ashore!"); }
        if (tier >= 2 && !doubleMinesUnlocked) { doubleMinesUnlocked = true; showWarn("1000m! The mines now come in pairs..."); }

        const phase = currentPhase();
        const storm = stormInfo();

        drawSky(phase);
        drawWater();

        const band = currentBand();
        drawEnvironment(band);

        if (band.biome !== lastBiomeShown) {
            lastBiomeShown = band.biome;
            if (band.biome === 'canyon') showWarn("Squeeze through the mountain pass!");
            else if (band.biome === 'jungle') showWarn("Entering the jungle river...");
            else showWarn("Back in open water!");
        }
        updateNextBiomeSign(band, storm);

        if (storm.warning && frame % 90 === 0) showWarn("A storm is rolling in...");

        if (distance > nextGauntletAt) {
            spawnJumpGauntlet(band);
            nextGauntletAt = distance + 220 + Math.random() * 140;
            showWarn("Jump! Jump! Jump!");
        }

        player.x += (player.targetX - player.x) * 0.15;
        if (player.jumpV !== 0 || player.z > 0) {
            player.z += player.jumpV;
            player.jumpV -= 0.5;
            if (player.z < 0) { player.z = 0; player.jumpV = 0; }
        }

        applyWhirlpoolPull();

        // Storm wind: a steady sideways push that acts like its own hazard, gentler in tight passes
        if (storm.active) {
            const windDir = (storm.cycleIndex % 2 === 0) ? 1 : -1;
            const scale = band.bounded ? 0.4 : 1;
            player.pulled += windDir * storm.intensity * 0.55 * scale;
        }

        checkBankCollision(band);
        if (invuln > 0) invuln--;
        if (shieldTime > 0) shieldTime--;

        drawPhaseTint(phase);
        drawPlayer();
        drawParticles();

        obstacles.forEach((obs, i) => {
            obs.y += obs.speed;
            obs.draw();

            if (obstacles[i] && checkCollision(obs)) {
                if (shieldTime > 0) {
                    // shield up: plow straight through, no damage
                    spawnSplash(obs.x + obs.w / 2, obs.y + obs.h / 2, 6);
                    if (obs.type !== 'whirlpool') obstacles.splice(i, 1);
                } else if (invuln <= 0) {
                    lives--;
                    invuln = 45;
                    spawnSplash(player.x + player.pulled, player.y, 14);
                    if (obs.type === 'whirlpool') {
                        player.pulled += (Math.random() - 0.5) * 40; // knockback
                    } else {
                        obstacles.splice(i, 1);
                    }
                    updateHUD();
                    if (lives <= 0) gameOver();
                }
            }

            if (obstacles[i] && obs.y > GAME_H + 60) {
                obstacles.splice(i, 1);
            }
        });

        updateAndDrawPickups(band);
        spawnObstacles(band, phase.isNight);
        spawnPickups(band);

        if (storm.active) drawStorm(storm);
        drawFloatingTexts();

        distance += 0.12;
        worldScroll += speed;
        if (frame % 30 === 0) updateHUD();

        // Speed ramps up faster the longer you survive — steady difficulty climb
        speed = 3 + (distance / 300) + (zone - 1) * 0.4 + currentTier() * 0.3;

        frame++;
        requestAnimationFrame(loop);
    }

    // ---------- Weather visuals ----------
    function drawStorm(storm) {
        ctx.save();
        ctx.globalAlpha = 0.25 * storm.intensity;
        ctx.fillStyle = '#1a2430';
        ctx.fillRect(0, 0, GAME_W, GAME_H);
        ctx.restore();

        const windDir = (storm.cycleIndex % 2 === 0) ? 1 : -1;
        ctx.save();
        ctx.strokeStyle = `rgba(220,230,240,${0.25 * storm.intensity})`;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 26; i++) {
            const rx = (i * 53 + (worldScroll * 2.4 * windDir)) % (GAME_W + 80) - 40;
            const ry = (i * 71 + worldScroll * 3.1) % (GAME_H + 60) - 30;
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx + windDir * 10, ry + 16);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawPhaseTint(phase) {
        if (phase.color.a <= 0.01) return;
        // ⚠️ FIX — this used to paint over the ENTIRE canvas (0,0 → GAME_W,GAME_H)
        // and was called at the very end of the frame, AFTER the player and all
        // obstacles were already drawn — so at night it darkened the player and
        // every enemy by the same amount as the water, making enemies hard to
        // see and the character look dim. It's now (a) clipped to the water
        // area only (below the horizon — the sky has its own night look from
        // drawSky()), and (b) called BEFORE drawPlayer()/obstacles instead of
        // after, so the character and enemies are drawn fully bright on top of
        // the darkened water instead of getting darkened themselves.
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, HORIZON_Y, GAME_W, GAME_H - HORIZON_Y);
        ctx.clip();
        ctx.fillStyle = `rgba(${phase.color.r | 0},${phase.color.g | 0},${phase.color.b | 0},${phase.color.a})`;
        ctx.fillRect(0, HORIZON_Y, GAME_W, GAME_H - HORIZON_Y);
        if (phase.isNight) {
            // twinkling stars reflected in the water, seeded by position so they don't jitter frame to frame
            for (let i = 0; i < 24; i++) {
                const sx = (i * 137 + 41) % GAME_W;
                const sy = HORIZON_Y + ((i * 89 + 17) % (GAME_H * 0.35));
                const tw = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.03 + i));
                ctx.globalAlpha = tw * phase.color.a;
                ctx.fillStyle = '#fff';
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }
        }
        ctx.restore();
    }

    // ---------- Reward pickups: drop coins (small, frequent) and hearts (rare, extra life) ----------

    function spawnPickups(band) {
        if (Math.random() < 0.0035) {
            spawnOnePickup(band, 'coin');
        } else if (lives < maxLives && Math.random() < 0.0004) {
            spawnOnePickup(band, 'heart');
        } else if (powerupsUnlocked && shieldTime <= 0 && Math.random() < 0.00035) {
            spawnOnePickup(band, 'lightning');
        }
    }

    function spawnOnePickup(band, type) {
        const y = -30;
        let x;
        if (band && band.bounded) {
            const l = bandLeft(band, y) + 20;
            const r = bandRight(band, y) - 20;
            x = l + Math.random() * Math.max(10, r - l);
        } else {
            x = 30 + Math.random() * (GAME_W - 60);
        }
        const p = { type, x, y, w: 20, h: 20, speed: speed * 0.85, bob: Math.random() * Math.PI * 2 };
        if (type === 'coin') {
            // ⚠️ CHANGED — was 0.0001–0.2. This value IS the DC reward now
            // (see api/earn.js's claimGameReward, GAME_COINS_TO_DC=1 — no
            // multiplier), so tune this range directly to change the
            // in-game economy. Still heavily weighted toward tiny values
            // via pow(rand,4), occasionally up to the top of the range.
            p.value = 0.001 + Math.pow(Math.random(), 4) * (0.3 - 0.001);
        }
        pickups.push(p);
    }

    function updateAndDrawPickups(band) {
        pickups.forEach((p, i) => {
            p.y += p.speed;
            p.bob += 0.1;
            const by = Math.sin(p.bob) * 3;

            ctx.save();
            if (p.type === 'coin') {
                ctx.globalAlpha = 0.9;
                if (assetsReady.waterDropImg) {
                    ctx.drawImage(waterDropImg, p.x, p.y + by, p.w, p.h);
                } else {
                    ctx.fillStyle = '#4fc3f7';
                    ctx.beginPath();
                    ctx.arc(p.x + p.w / 2, p.y + p.h / 2 + by, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (p.type === 'lightning') {
                ctx.globalAlpha = 0.95;
                ctx.shadowColor = '#7CFC00';
                ctx.shadowBlur = 8;
                if (assetsReady.lightningImg) {
                    ctx.drawImage(lightningImg, p.x, p.y + by, p.w, p.h * 1.3);
                } else {
                    ctx.fillStyle = '#9CFC5C';
                    ctx.fillRect(p.x + 4, p.y + by, 12, 22);
                }
            } else {
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('❤️', p.x + p.w / 2, p.y + p.h / 2 + by + 6);
            }
            ctx.restore();

            const px = player.x + player.pulled;
            if (px + player.w * 0.3 < p.x + p.w && px + player.w * 0.7 > p.x &&
                player.y < p.y + p.h && player.y + player.h * 0.6 > p.y) {
                if (p.type === 'coin') {
                    coins += p.value;
                    floatingTexts.push({ x: p.x + p.w / 2, y: p.y, text: '+' + p.value.toFixed(4) + ' 💧', life: 40 });
                } else if (p.type === 'lightning') {
                    shieldTime = 300; // ~5 seconds of invincibility
                    floatingTexts.push({ x: p.x + p.w / 2, y: p.y, text: 'SHIELD UP! ⚡', life: 40 });
                } else {
                    lives = Math.min(maxLives, lives + 1);
                    floatingTexts.push({ x: p.x + p.w / 2, y: p.y, text: '+1 ❤️', life: 40 });
                }
                spawnSplash(p.x + p.w / 2, p.y + p.h / 2, 5);
                updateHUD();
                pickups.splice(i, 1);
                return;
            }
            if (p.y > GAME_H + 30) pickups.splice(i, 1);
        });
    }

    function drawFloatingTexts() {
        floatingTexts.forEach((t, i) => {
            t.y -= 0.6;
            t.life--;
            ctx.save();
            ctx.globalAlpha = Math.max(0, t.life / 40);
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#06283d';
            ctx.lineWidth = 3;
            ctx.strokeText(t.text, t.x, t.y);
            ctx.fillText(t.text, t.x, t.y);
            ctx.restore();
            if (t.life <= 0) floatingTexts.splice(i, 1);
        });
    }

    function gameOver() {
        gameActive = false;
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-dist').innerText = Math.floor(distance);
        document.getElementById('final-coins').innerText = '💧 ' + coins.toFixed(4);
        // Tell the host app (Surf Blaze) how many drop-coins were collected
        // this run, so it can turn them into real DC balance. Standalone
        // (opened outside the app) this is a no-op since there's no parent.
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'surfdrive:gameover', coins: coins, distance: Math.floor(distance) }, '*');
        }
    }

    // Exits back to the host app (Surf Blaze). Falls back to a plain reload
    // when the game is opened standalone, outside the app's iframe.
    function exitToApp() {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'surfdrive:exit' }, '*');
        } else {
            location.reload();
        }
    }

    function resetGame() {
        distance = 0; lives = 3; obstacles = []; particles = []; bursts = []; speed = 3;
        zone = 1; creaturesUnlocked = false; whirlpoolsUnlocked = false; invuln = 0;
        sharksUnlocked = false; powerupsUnlocked = false; doubleMinesUnlocked = false; shieldTime = 0;
        player.pulled = 0; worldScroll = 0; decos = []; lastBiomeShown = 'ocean';
        nextGauntletAt = 180;
        coins = 0; pickups = []; floatingTexts = [];
        document.getElementById('next-biome').style.opacity = 0;
        gameActive = true;
        document.getElementById('game-over').style.display = 'none';
        updateHUD();
        loop();
    }

    // ---------- Movement: smooth whole-screen drag (original, restored) ----------
    window.addEventListener('mousemove', (e) => {
        let rect = canvas.getBoundingClientRect();
        let scaleX = GAME_W / rect.width;
        player.targetX = (e.clientX - rect.left) * scaleX;
    });

    window.addEventListener('touchmove', (e) => {
        let rect = canvas.getBoundingClientRect();
        let scaleX = GAME_W / rect.width;
        player.targetX = (e.touches[0].clientX - rect.left) * scaleX;
        e.preventDefault();
    }, { passive: false });

    // ---------- Jump button ----------
    (function setupJumpButton() {
        const btn = document.getElementById('jump-btn');
        btn.addEventListener('mousedown', (e) => { jump(); e.preventDefault(); });
        btn.addEventListener('touchstart', (e) => { jump(); e.preventDefault(); }, { passive: false });
    })();

    initFoam();
    initBgStones();
    updateHUD();
    loop();
</script>
</body>
</html>
