    .tk-adtask { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }

    /* ── Task popup (centered card + 4s ring, 15 Oct 2026) — replaces the bottom sheet ── */
    .tkm-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(10,9,12,0.82); animation: tkm-fade 0.18s ease both; }
    .tkm-card { width: 100%; max-width: 330px; padding: 26px 22px 18px; border-radius: 26px; text-align: center; background: var(--surface); border: 1px solid var(--glass-border); box-shadow: 0 20px 50px rgba(20,70,170,0.18); animation: tkm-pop 0.22s cubic-bezier(.2,.9,.3,1.15) both; }
    @keyframes tkm-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tkm-pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    .tkm-ring { position: relative; width: 84px; height: 84px; margin: 0 auto 14px; }
    .tkm-ring svg { display: block; transform: rotate(-90deg); }
    .tkm-ring circle { fill: none; stroke-width: 6; }
    .tkm-ring .bg { stroke: rgba(30,107,255,0.12); }
    .tkm-ring .fg { stroke: var(--nav-task); stroke-linecap: round; stroke-dasharray: 245.04; stroke-dashoffset: 245.04; }
    .tkm-ring.run .fg { animation: tkm-fill 4s linear forwards; }
    .tkm-ring.done .fg { stroke: #3DDC84; stroke-dashoffset: 0; animation: none; }
    @keyframes tkm-fill { to { stroke-dashoffset: 0; } }
    .tkm-ring-in { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 28px; font-weight: 800; color: var(--ink); }
    .tkm-ring.done .tkm-ring-in { color: #3DDC84; }
    .tkm-name { font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.3; word-break: break-word; }
    .tkm-reward { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 800; color: var(--nav-task); background: var(--nav-task-soft); }
    .tkm-hint { min-height: 34px; margin-top: 12px; font-size: 12.5px; line-height: 1.45; color: var(--ink-muted); }
    .tkm-act { width: 100%; height: 48px; margin-top: 12px; border: 0; border-radius: 15px; font-size: 14.5px; font-weight: 800; color: #FFFFFF; background: linear-gradient(100deg, var(--coin), var(--accent)); box-shadow: 0 8px 20px rgba(30,107,255,0.32); animation: tkm-pop 0.22s ease both; }
    .tkm-act.verify { color: #fff; background: var(--signal); box-shadow: 0 8px 20px rgba(79,124,255,0.32); }
    .tkm-act:active { transform: scale(0.97); }
    .tkm-act[disabled] { opacity: 0.7; }
    .tkm-cancel { margin-top: 8px; padding: 10px 16px; border: 0; background: transparent; color: var(--ink-muted); font-size: 13px; font-weight: 600; }

    .task-vanish {
        animation: task-vanish 0.46s cubic-bezier(.4,0,.6,1) forwards;
        pointer-events: none;
    }
    @keyframes task-vanish {
        0%   { opacity: 1; transform: scale(1) translateX(0); max-height: 200px; margin-bottom: 10px; }
        40%  { opacity: 0; transform: scale(0.92) translateX(40px); }
        100% { opacity: 0; transform: scale(0.9) translateX(60px); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; overflow: hidden; }
    }

    /* ══════════════════════════════════════════════════════════
       REWARD CELEBRATION — "Congratulations" overlay shown any
       time a reward is credited (promo / lootbox / ad / task).
       Pure visual layer — does not touch any reward logic.
       ══════════════════════════════════════════════════════════ */
    .congrats-overlay { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; background: rgba(6,10,6,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: congrats-bg-in 0.3s ease both; }
    .congrats-overlay.closing { animation: congrats-bg-out 0.3s ease both; }
    @keyframes congrats-bg-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes congrats-bg-out { from { opacity: 1; } to { opacity: 0; } }
    .congrats-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 34px 38px; border-radius: 24px; background: linear-gradient(160deg, var(--surface-pop), var(--surface-raised)); border: 0.5px solid var(--border-strong); box-shadow: 0 24px 60px rgba(20,70,170,0.18); animation: congrats-card-in 0.5s cubic-bezier(.34,1.56,.64,1) both; text-align: center; max-width: 300px; }
    .congrats-overlay.closing .congrats-card { animation: congrats-card-out 0.28s ease both; }
    @keyframes congrats-card-in { 0% { transform: scale(0.6) translateY(24px); opacity: 0; } 60% { transform: scale(1.06) translateY(0); opacity: 1; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes congrats-card-out { to { transform: scale(0.85); opacity: 0; } }
    .congrats-glow { position: absolute; inset: -34%; border-radius: 50%; background: radial-gradient(circle, rgba(46,134,255,0.35), transparent 70%); animation: congrats-glow-pulse 1.8s ease-in-out infinite; z-index: 0; pointer-events: none; }
    @keyframes congrats-glow-pulse { 0%,100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 0.9; transform: scale(1.1); } }
    .congrats-icon { position: relative; z-index: 1; font-size: 50px; line-height: 1; animation: congrats-icon-bounce 0.8s cubic-bezier(.34,1.56,.64,1) 0.05s both, congrats-icon-wiggle 2.1s ease-in-out 0.85s infinite; }
    @keyframes congrats-icon-bounce { 0% { transform: scale(0) rotate(-18deg); } 60% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes congrats-icon-wiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
    .congrats-title { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.3px; margin-top: 6px; opacity: 0; animation: fade-up 0.5s ease 0.22s forwards; }
    .congrats-sub { position: relative; z-index: 1; font-size: 12px; color: var(--ink-muted); margin-top: 3px; opacity: 0; animation: fade-up 0.5s ease 0.32s forwards; }
    .congrats-amount { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 700; font-size: 27px; color: var(--coin); margin-top: 4px; opacity: 0; text-shadow: 0 0 18px rgba(46,134,255,0.55); animation: congrats-amount-in 0.55s cubic-bezier(.34,1.56,.64,1) 0.42s forwards; }
    @keyframes congrats-amount-in { from { opacity: 0; transform: scale(0.6) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .congrats-hint { position: relative; z-index: 1; font-size: 10.5px; color: var(--ink-faint); margin-top: 14px; opacity: 0; animation: fade-up 0.5s ease 0.6s forwards; }

    /* ══════════════════════════════════════════════════════════
       BACKGROUND — ⚠️ CHANGED (theme redesign): the old galaxy-bg was a
       fully animated system (drifting nebula blobs, two scrolling star
       layers, twinkling dots). The new brief explicitly calls for a
       COMPLETELY STATIC background — no moving particles, no animated
       stars, no floating objects — just a deep midnight base with a
       subtle, still cyan/violet glow. Kept the same #galaxy-bg id (so
       nothing else has to change) but it's now two fixed radial
       gradients, nothing more. The old JS star/twinkle generator below
       is now a no-op for the same reason (kept, emptied, rather than
       deleted, in case animated stars are ever wanted back).
       ══════════════════════════════════════════════════════════ */
    #galaxy-bg {
        position: fixed; inset: 0; z-index: -2; pointer-events: none;
        background:
            radial-gradient(ellipse 70% 50% at 15% -10%, var(--bg-nebula-1), transparent 60%),
            radial-gradient(ellipse 70% 50% at 90% 110%, var(--bg-nebula-2), transparent 60%),
            var(--bg);
    }

    /* ══════════════════════════════════════════════════════════
       HOME v2 — glass hero card, hexagon badge, quick-link grid,
       and a bottom quick-action row (visual layer only — every id
       used by JS below is preserved so no function is touched).
       ══════════════════════════════════════════════════════════ */
    .bal-hero { position: relative; border-radius: 22px; padding: 20px 18px 18px; overflow: hidden; background: radial-gradient(ellipse 120% 90% at 100% -10%, var(--signal-soft), transparent 60%), var(--glass-bg-raised); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--glass-border-violet); box-shadow: 0 0 0 1px rgba(79,124,255,0.06), 0 20px 40px rgba(20,70,170,0.18); }
    .bal-hero-glow { position: absolute; top: -60px; right: -50px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--coin-soft), transparent 70%); pointer-events: none; z-index: 0; }
    .bal-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
    .bal-hero-badge { width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: linear-gradient(155deg, var(--coin-soft), var(--surface-pop) 75%); border: 1px solid var(--coin-soft); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--coin); box-shadow: 0 0 18px var(--coin-soft), inset 0 1px 1px rgba(255,255,255,0.15); }
    .bal-hero-chip { font-size: 10.5px; color: var(--ink-faint); background: rgba(30,107,255,0.07); border: 0.5px solid var(--border); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
    .bal-hero-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 30px; color: var(--coin); margin-top: 2px; }
    .bal-hero-ledger-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
    .bal-hero-ledger { font-size: 10.5px; color: var(--ink-faint); background: rgba(30,107,255,0.07); border: 0.5px solid var(--border); padding: 4px 10px; border-radius: 999px; }
    .bal-hero-ledger b { color: var(--ink-muted); font-weight: 600; font-family: var(--font-mono); }
    .bal-hero-rate { margin-top: 8px; font-size: 11px; color: var(--ink-faint); position: relative; z-index: 1; }
    /* ⚠️ NEW — two-box USDT/GM coin split row (per admin request, matching the
       Clover Nest reference: one balance box per currency, side by side). */
    .bal-split-row { display: flex; gap: 10px; margin-top: 12px; position: relative; z-index: 1; }
    .bal-split-box { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 14px; background: rgba(30,107,255,0.07); border: 0.5px solid var(--border); }
    .bal-split-label { font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }
    .bal-split-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 17 Oct 2026: Spin Wheel CSS removed together with the feature. */

    /* quick-link 2x2 grid — Weekly Contest / Leaderboard / Official / Pay */
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick-grid-card { display: flex; align-items: center; gap: 10px; padding: 12px 12px; border-radius: 16px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); text-align: left; }
    .quick-grid-card:active { transform: scale(0.97); }
    .quick-grid-icon { width: 36px; height: 36px; flex-shrink: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .quick-grid-title { font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.25; }
    .quick-grid-sub { font-size: 10px; color: var(--ink-faint); margin-top: 1px; }

    /* bottom quick-action row — 5 circular icons, 2 wired live, 3 "coming soon" */
    /* ⚠️ NEW — 2×2 big feature-card grid (Home tab, replaces the old .qa-row
       5-button "coming soon" strip, which is fully removed below). */
    .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .feature-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 20px 10px 18px; border-radius: 18px; border: 1px solid var(--fc-border, var(--glass-border)); background: var(--fc-bg, var(--glass-bg)); }
    .feature-card:active { transform: scale(0.97); }
    /* ⚠️ CHANGED — icon is coded SVG now (per admin request), not a cropped
       image — this is a circular badge wrapper around it instead of an <img>. */
    .feature-card-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; background: var(--fc-icon-bg, rgba(255,255,255,0.06)); border: 1px solid var(--fc-border, var(--glass-border)); }
    .feature-card-title { font-size: 14px; font-weight: 700; color: var(--ink); }
    .feature-card-sub { font-size: 11px; color: var(--ink-faint); }
    /* ⚠️ NEW — single-column list rows (Leaderboard/Weekly Contest/Pay
       Channel/Official Channel), replacing their old 2-col .quick-grid
       placement — same .quick-grid-title/.quick-grid-sub text classes reused. */
    .home-list { display: flex; flex-direction: column; gap: 8px; }
    .home-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); text-align: left; }
    .home-row:active { transform: scale(0.98); }
    .home-row-icon { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; overflow: hidden; }

    /* ══════════════════════════════════════════════════════════
       HOME v4 — reference-screenshot layout (admin-provided image):
       wallet-icon hero card w/ Level pill + orbiting-planet graphic,
       two bold color-block feature cards (Withdraw/Spin), a slim
       promo "Redeem" row (button opens the existing promo modal
       instead of an inline input), a 4-icon quick-access strip
       (Watch Videos/Tasks/Refer/Buy Referral — Buy Referral opens the
       Punch Key store), and the Leaderboard/Weekly
       Contest/Payment Channel rows merged into ONE card with divider
       lines instead of three separate boxes. Reuses existing colors
       (--coin mint, --signal violet, --net-monetag green) so it
       still belongs to the app's palette rather than pasting in the
       screenshot's exact hex values. ══════════════════════════════════════════════════════════ */
    .wtc-card { position: relative; overflow: hidden; border-radius: 22px; padding: 18px 18px 16px; background: linear-gradient(165deg, var(--glass-bg-raised), var(--surface)); border: 1px solid var(--glass-border); box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 16px 34px rgba(20,70,170,0.18); }
    .wtc-card-top { display: flex; align-items: flex-start; justify-content: space-between; position: relative; z-index: 1; }
    .wtc-card-icon { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(155deg, var(--coin), var(--coin-deep) 85%); box-shadow: 0 0 16px var(--coin-soft), inset 0 1px 1px rgba(255,255,255,0.35); }
    .wtc-card-level { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: rgba(92,200,255,0.14); border: 1px solid rgba(92,200,255,0.4); color: #5CC8FF; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
    .wtc-card-planet { position: absolute; right: 8px; top: 46px; width: 96px; height: 96px; z-index: 0; pointer-events: none; }
    .wtc-card-planet-core { position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 32% 26%, #DFF1FF, #2E86FF 45%, #1247C9 100%); box-shadow: 0 0 26px rgba(46,134,255,0.5), inset -6px -6px 14px rgba(20,70,170,0.18), inset 4px 4px 10px rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: #04241E; }
    .wtc-card-planet-ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(46,134,255,0.55); transform: rotate(-20deg) scaleY(0.4); box-shadow: 0 0 14px rgba(46,134,255,0.35); }
    .wtc-card-label { margin-top: 14px; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); position: relative; z-index: 1; }
    .wtc-card-num { font-family: var(--font-display); font-weight: 700; font-size: 27px; color: var(--ink); margin-top: 3px; position: relative; z-index: 1; }
    .wtc-card-num .unit { font-size: 15px; font-weight: 600; color: var(--ink-muted); margin-left: 4px; }
    .wtc-card-usd { margin-top: 4px; font-size: 13px; color: var(--ink-muted); position: relative; z-index: 1; }
    .wtc-card-divider { margin: 14px 0 12px; height: 1px; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); position: relative; z-index: 1; }
    .wtc-card-bottom { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
    .wtc-card-bottom-item { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-muted); }
    .wtc-card-bottom-item b { color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
    .wtc-card-bottom-sep { width: 1px; align-self: stretch; background: var(--border); }
    .wtc-card-copy { flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; border: none; background: rgba(30,107,255,0.06); color: var(--ink-faint); display: flex; align-items: center; justify-content: center; }

    /* two bold color-block feature cards (Withdraw / Spin Wheel) */
    .feat2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .feat2-card { position: relative; min-height: 148px; overflow: hidden; border-radius: 20px; padding: 18px 16px 16px; text-align: left; border: 1px solid rgba(30,107,255,0.12); }
    .feat2-card:active { transform: scale(0.97); }
    .feat2-withdraw { background: linear-gradient(155deg, #2FD88A, #0B6B42 88%); }
    .feat2-icon { width: 46px; height: 46px; border-radius: 13px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; }
    .feat2-title { margin-top: 14px; font-size: 17px; font-weight: 700; color: #fff; }
    .feat2-sub { margin-top: 2px; font-size: 11.5px; color: rgba(255,255,255,0.8); }
    .feat2-arrow { position: absolute; right: 14px; bottom: 14px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: #fff; }

    /* slim promo "Redeem" row — button opens the promo modal */
    .promo2-row { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 14px 14px 14px 12px; background: linear-gradient(160deg, var(--gift-soft), var(--surface)); border: 1px solid var(--gift-soft); }
    .promo2-icon { width: 38px; height: 38px; border-radius: 11px; background: rgba(56,189,248,0.14); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .promo2-title { font-weight: 600; font-size: 14px; color: var(--gift-hue); }
    .promo2-sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; }
    .promo2-btn { flex-shrink: 0; display: flex; align-items: center; gap: 3px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--glass-border-violet); background: rgba(30,107,255,0.07); color: var(--coin); font-weight: 600; font-size: 12.5px; }
    .promo2-btn:active { transform: scale(0.95); }

    /* 4-icon quick-access strip (Watch Videos / Tasks / Refer / Buy Referral) */
    .qi-card { border-radius: 18px; padding: 14px 6px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

    .qi-item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; color: inherit; padding: 2px 2px; text-align: center; }
    .qi-item:active { transform: scale(0.94); }
    .qi-circle { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .qi-label { font-size: 11.5px; font-weight: 700; color: var(--ink); line-height: 1.2; }
    .qi-sub { font-size: 9.5px; color: var(--ink-faint); margin-top: -3px; }
    .qi-chevron { color: var(--ink-faint); opacity: 0.7; margin-top: 1px; }

    /* Leaderboard / Weekly Contest / Payment Channel merged into ONE card
       with divider lines, instead of three separately-boxed .home-row items */
    .home-card-list { border-radius: 18px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; }
    .home-card-list .home-row { border: none; border-radius: 0; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 1px solid var(--border); }
    .home-card-list .home-row:last-child { border-bottom: none; }

    /* ══════════════════════════════════════════════════════════
       WHITE × BLUE THEME — final overrides (GameVo Mine).
       Palette lives in :root above; this block only fixes the spots
       that were hand-written for the old dark theme.
       ══════════════════════════════════════════════════════════ */
    html, body { background: var(--bg); color: var(--ink); }
    #galaxy-bg { background:
        radial-gradient(ellipse 80% 45% at 10% -8%, rgba(46,134,255,0.22), transparent 62%),
        radial-gradient(ellipse 80% 45% at 100% 105%, rgba(110,190,255,0.26), transparent 62%),
        linear-gradient(180deg, #F7FAFF 0%, #EAF3FF 100%); }
    #galaxy-bg .star-layer, #galaxy-bg .galaxy-nebula { display: none !important; }
    #grain-overlay { display: none; }
    .card, .hero-balance, .bal-hero, .wtc-card, .tkm-card, .congrats-card { box-shadow: 0 10px 28px rgba(30,107,255,0.10), 0 1px 0 rgba(255,255,255,0.9) inset; }
    .bottomnav { box-shadow: 0 10px 30px rgba(30,107,255,0.18); background: rgba(255,255,255,0.94); }

// Splash progress: eases toward ~90% while the app really loads; init() calls window.__splashFinish() to snap to 100%.
(function () {
    var fill = document.getElementById('ns-fill'), pct = document.getElementById('ns-pct'), done = false, t0 = performance.now();
    function tick(now) {
        if (done || !fill) return;
        var v = 90 * (1 - Math.exp(-((now - t0) / 1000) / 1.7));
        fill.style.width = v + '%'; pct.textContent = Math.floor(v) + '%';
        requestAnimationFrame(tick);
    }
    (function(){ var sc=document.getElementById('ms-scene'); if(sc){ sc.style.setProperty('--s', Math.min(1, (window.innerWidth||360)/450).toFixed(3)); } })();
    window.__splashFinish = function () { done = true; if (fill) { fill.style.width = '100%'; pct.textContent = '100%'; } };
    requestAnimationFrame(tick);
})();
</script>

// ══════════════════════════════════════════════════════════════
// GALAXY BACKGROUND — generates two star-density layers using a
// single box-shadow trick (one real element, hundreds of "stars"
// ══════════════════════════════════════════════════════════════
// ⚠️ CHANGED (theme redesign) — this used to generate random star-dust
// box-shadows + twinkling dots for the old animated galaxy background.
// The new theme brief requires a fully static background (see #galaxy-bg
// CSS above), so this is now intentionally a no-op. Left in place rather
// than deleted in case animated stars are ever wanted back — just flip
// the early return off.
// ══════════════════════════════════════════════════════════════
(function initGalaxyBackground() {
    return; // ⚠️ static background per theme redesign — nothing to generate
    function makeStars(count, minSize, maxSize) {
        const w = 1000, h = 2000;
        let shadows = [];
        for (let i = 0; i < count; i++) {
            const x = Math.round(Math.random() * w);
            const y = Math.round(Math.random() * h);
            const size = (Math.random() * (maxSize - minSize) + minSize).toFixed(1);
            const op = (Math.random() * 0.6 + 0.3).toFixed(2);
            shadows.push(`${x}px ${y}px 0 rgba(255,255,255,${op})`);
        }
        return { shadows: shadows.join(',') };
    }
    const far = document.getElementById('star-layer-far');
    const near = document.getElementById('star-layer-near');
    if (far) {
        const s = makeStars(140, 0.6, 1.2);
        far.style.boxShadow = s.shadows;
        far.style.width = '1px'; far.style.height = '1px';
    }
    if (near) {
        const s = makeStars(70, 1.2, 2.2);
        near.style.boxShadow = s.shadows;
        near.style.width = '2px'; near.style.height = '2px';
    }
    // sprinkle a handful of twinkling stars on top for extra sparkle
    const bg = document.getElementById('galaxy-bg');
    if (bg) {
        for (let i = 0; i < 10; i++) {
            const dot = document.createElement('div');
            dot.className = 'star-twinkle';
            const size = (Math.random() * 1.6 + 1).toFixed(1);
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.left = Math.random() * 100 + '%';
            dot.style.top = Math.random() * 100 + '%';
            dot.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
            bg.appendChild(dot);
        }
    }
})();

function openTonkeeperLink(url) {

    return `<span class="tg-avatar" style="${size ? `width:${size}px; height:${size}px; font-size:${Math.round(size * 0.4)}px;` : ''}">${initial}${img}</span>`;

// ══════════════════════════════════════════════════════════════
// API helpers — apiPost automatically attaches the signed Telegram
// initData to every request, so individual call sites never need to
// (and never should) pass a raw userId — the server derives it from
// the verified session instead.
// ⚠️ FIX — fetch() previously had NO timeout, so on a slow/dead mobile
// connection this could hang forever, leaving the user stuck on the splash
// screen's static "92%" bar with zero feedback and no way to recover short
// of force-closing the app. Now every call aborts after API_TIMEOUT_MS and
// resolves to {ok:false, error:'timeout'} instead of hanging indefinitely.
// ══════════════════════════════════════════════════════════════
const API_TIMEOUT_MS = 15000;
async function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
    try {
        return await fetch(url, { ...options, signal: controller.signal });
    } finally { clearTimeout(t); }
}
async function apiPost(path, body = {}) {
    try {
        const res = await fetchWithTimeout(`${API_BASE}/${path}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...body, initData: TG_INIT_DATA }),
        });
        const data = await res.json();
        return data;
    } catch (e) { return { ok: false, error: e?.name === 'AbortError' ? 'timeout' : 'server_error' }; }
}
async function apiGet(path) {
    try { const res = await fetchWithTimeout(`${API_BASE}/${path}`); return await res.json(); }
    catch (e) { return { ok: false, error: e?.name === 'AbortError' ? 'timeout' : 'server_error' }; }
}

// PARTICLE BURST — lightweight canvas confetti for reward moments
// (ad reward, task complete, promo redeem).
// Self-contained, auto-clears after ~1s — never blocks interaction.
// ══════════════════════════════════════════════════════════════
const burstCanvas = document.getElementById('burst-canvas');
const burstCtx = burstCanvas.getContext('2d');
function resizeBurstCanvas() { burstCanvas.width = window.innerWidth; burstCanvas.height = window.innerHeight; }
resizeBurstCanvas();
window.addEventListener('resize', resizeBurstCanvas);

function triggerBurst(originEl) {
    const rect = originEl ? originEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    const colors = ['#2E86FF', '#1E6BFF', '#4F7CFF', '#5CC8FF'];
    const particles = Array.from({ length: 26 }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 4.5;
        return { x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1 };
    });
    let frame = 0;
    function tick() {
        frame++;
        burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
        let alive = false;
        particles.forEach(p => {
            if (p.life <= 0) return;
            p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life -= 0.022;
            if (p.life > 0) {
                alive = true;
                burstCtx.globalAlpha = Math.max(p.life, 0);
                burstCtx.fillStyle = p.color;
                burstCtx.beginPath(); burstCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); burstCtx.fill();
            }
        });
        burstCtx.globalAlpha = 1;
        if (alive && frame < 90) requestAnimationFrame(tick);
        else burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
    }
    tick();
}

// ══════════════════════════════════════════════════════════════
// COUNT-UP — animates a number from its current value to a new target
// ══════════════════════════════════════════════════════════════
function animateCountUp(el, from, to, duration = 700) {
    if (!el) return;
    const start = performance.now();
    const diff = to - from;
    function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = fmtWTC(from + diff * eased);
        if (t < 1) requestAnimationFrame(step);
        else el.textContent = fmtWTC(to);
    }
    requestAnimationFrame(step);
}

const RANK_TIERS = [
    { name: 'Bronze',   icon: '🥉', min: 0 },
    { name: 'Silver',   icon: '🥈', min: 50000 },
    { name: 'Gold',     icon: '🥇', min: 200000 },

function getRankInfo(u) {
    const lt = Math.max(u?.lifetimeWtcEarned || 0, 0);
    let idx = 0;
    RANK_TIERS.forEach((t, i) => { if (lt >= t.min) idx = i; });
    const cur = RANK_TIERS[idx];
    const next = RANK_TIERS[idx + 1] || null;
    const pct = next ? Math.min(100, Math.max(0, Math.round(((lt - cur.min) / (next.min - cur.min)) * 100))) : 100;
    return { cur, next, pct, lt };
}

// Shared promo-redeem flow (ad-gate -> claim), used by BOTH the inline Home
// promo box and the openPromoModal() popup, so the anti-abuse "must watch an
// ad before the code is spent" behavior can't drift out of sync between them.
async function redeemPromoCode(code, btn, onSuccess) {
    if (!code) return toast('Please enter a code.', 'error');
    const originalLabel = btn.textContent;
    btn.textContent = 'Please wait...'; btn.disabled = true;

    // ⚠️ NEW — validate the code BEFORE showing an ad. Previously the ad
    // played no matter what, so an invalid/expired/already-used code still
    // cost the user a full ad watch before telling them it failed. This
    // check doesn't spend the code (see handleCheckPromo in api/earn.js) —
    // the real, atomic redemption still happens after the ad, below.
    const check = await apiPost('earn', { action: 'checkPromo', code });
    if (!check.ok) {
        toast(errorText(check.error), 'error');
        btn.textContent = originalLabel; btn.disabled = false;
        return;
    }

    const candidates = [showGigaPubAd]; // 15 Oct 2026: Adsgram Daily removed // ⚠️ Monetag removed from random ad picks (admin request: no Monetag in promo) // ⚠️ FIX — showAdsgramSpecialAd no longer exists (network removed); swapped in showGigaPubAd
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    try {
        await pick();
    } catch (e) {
        toast(errorText(e.message), 'error');
        btn.textContent = originalLabel; btn.disabled = false;
        return;
    }

    const r = await apiPost('earn', { action: 'claimPromo', code });
    if (r.ok) {
        // 16 Oct 2026 — celebrate IMMEDIATELY; the balance refresh runs in the background (it used to be awaited first = extra waiting)
        onSuccess?.();
        showCongrats(`+${r.reward} GM coin`, '🎁', `≈ $${wtcToUsd(r.reward)} USD`);
        refreshUser().then(() => { if (state.activeTab === 'home') renderHome(); }).catch(() => {});
        return;
    }
    toast(errorText(r.error), 'error');
    btn.textContent = originalLabel; btn.disabled = false;
}

// live countdown for Mining: 01:59:07 (ticks every second)
function fmtHMS(ms) {
    const t = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}
function fmtCooldown(ms) {
    const totalMin = Math.ceil(ms / 60000);
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// 17 Oct 2026 — MINING BOOST: friends who joined through your link TODAY (Bangladesh time, boost ends at 12:00 AM) raise what EVERY collect pays
// (normal 50 · 2 friends 60 · 5 friends 80 · 10 friends 120). The numbers come from the server (action mineInfo → lib/constants.js
// MINING_BOOST_TIERS); this file only DRAWS them, so nothing here can be edited to get more GM coin — the server decides the reward at collect time.
// ══════════════════════════════════════════════════════════════
const MINING_COOLDOWN_MS = 2 * 60 * 60 * 1000;
let __miningBusy = false, __miningTimer = null;
let __mineBoost = null;        // last answer of mineInfo: { count, reward, base, boosted, endsAt, resetsAt, next, tiers }
let __mineSkew = 0;            // server clock − phone clock (ms), so the boost countdown is right even if the phone's clock is off
let __mineInfoAt = 0, __mineInfoBusy = false;
async function loadMineInfo(force) {
    if (__mineInfoBusy) return;
    if (!force && Date.now() - __mineInfoAt < 5 * 60 * 1000) return; // v1.2: was 60s
    __mineInfoBusy = true;
    try {
        const r = await apiPost('earn', { action: 'mineInfo' });
        if (r && r.ok) { __mineBoost = r.boost; __mineSkew = (r.serverNow || Date.now()) - Date.now(); __mineInfoAt = Date.now(); }
    } catch (e) { /* the card still works with the base reward */ }
    finally { __mineInfoBusy = false; paintMining(); }
}
function mineRewardNow() { return __mineBoost ? __mineBoost.reward : 50; }
function miningRemainingMs() {
    const last = state.user && state.user.lastMineAt;
    return last ? Math.max(0, new Date(last).getTime() + MINING_COOLDOWN_MS - Date.now()) : 0;
}
function paintMineBoost() {
    const box = document.getElementById('mine-boost');
    if (!box) return;
    const b = __mineBoost;
    if (!b) { box.innerHTML = ''; return; }
    const tiers = (b.tiers || []).map(t => `${t.minRefs} friends → <b>${t.reward}</b>`).join(' · ');
    if (b.boosted) {
        const left = Math.max(0, (b.endsAt || 0) - (Date.now() + __mineSkew));
        if (left <= 0 && Date.now() - __mineInfoAt > 5000) loadMineInfo(true);   // the boost just ran out → ask the server for the new tier
        box.innerHTML = `<div class="hm-boost-on">🚀 <b>Boost active:</b> ${b.reward} GM coin per collect · ends in <b class="mono-num">${fmtHMS(left)}</b> <span style="opacity:.8">(till 12:00 AM)</span></div>` +
            `<div class="hm-boost-s">${b.count} friend${b.count === 1 ? '' : 's'} joined today` +
            (b.next ? ` · invite <b>${b.next.need}</b> more → <b>${b.next.reward}</b> GM coin` : ' · top tier reached 🎉') + `</div>`;
    } else {
        box.innerHTML = `<div class="hm-boost-off">🔥 <b>Boost your mining:</b> friends who join via your link TODAY raise every collect (resets at 12:00 AM).</div>` +
            `<div class="hm-boost-s">${b.count} joined so far · ${tiers} <span style="opacity:.8">(normal ${b.base})</span></div>`;
    }
}
function paintMining() {
    const sub = document.getElementById('mine-sub'), badge = document.getElementById('mine-badge'), bar = document.getElementById('mine-bar');
    if (!sub) { if (__miningTimer) { clearInterval(__miningTimer); __miningTimer = null; } return false; }
    const card = document.getElementById('home-mining-card'), amt = document.getElementById('mine-amt');
    const reward = mineRewardNow();
    if (amt) amt.textContent = '+' + reward + ' GM coin';
    paintMineBoost();
    const ms = miningRemainingMs();
    if (__miningBusy) { sub.textContent = 'Working…'; badge.textContent = '…'; return true; }
    if (ms <= 0) {
        sub.textContent = 'Ready! Tap to collect ' + reward + ' GM coin (1 ad).';
        badge.textContent = 'COLLECT'; bar.style.width = '100%';
        if (card) card.classList.add('is-ready');
    } else {
        sub.textContent = 'Next collect in ' + fmtHMS(ms) + ' — mine ' + reward + ' GM coin by watching 1 ad.';
        badge.textContent = fmtHMS(ms); bar.style.width = Math.round((1 - ms / MINING_COOLDOWN_MS) * 100) + '%';
        if (card) card.classList.remove('is-ready');
    }
    return true;
}
function startMiningTicker() {
    if (__miningTimer) clearInterval(__miningTimer);
    paintMining();
    loadMineInfo(true);
    __miningTimer = setInterval(() => { paintMining(); loadMineInfo(false); }, 1000);   // loadMineInfo itself only calls the server about once a minute
}
async function startMiningCollect() {
    if (__miningBusy) return;
    const ms = miningRemainingMs();
    if (ms > 0) { toast('Mining ready in ' + fmtHMS(ms) + '.', 'info'); return; }
    __miningBusy = true; paintMining();
    window.__adBusy = true;
    try {
        const st = await apiPost('earn', { action: 'mineStart' });
        if (!st.ok) { toast(errorText(st.error), 'error'); if (st.error === 'mining_not_ready') await refreshUser(); return; }
        toast('Loading ad...', 'info');
        try { await (st.network === 'adsgramSpecial' ? showAdsgramSpecialAd : showGigaPubAd)(); }
        catch (e) { toast('Ad isn\'t available right now. Please try again.', 'error'); return; }
        toast('Confirming your reward…', 'info');
        let r = await apiPost('earn', { action: 'mineClaim' });
        for (let i = 0; i < 12 && !r.ok && r.error === 'proof_pending'; i++) {
            await new Promise(res => setTimeout(res, 1500));
            r = await apiPost('earn', { action: 'mineClaim' });
        }
        if (r.ok) {
            toast('+' + r.reward + ' GM coin mined!' + (r.boosted ? ' 🚀' : ''), 'success');
            showCongrats('+' + r.reward + ' GM coin', '⛏️', '≈ $' + wtcToUsd(r.reward) + ' USD');
            await refreshUser();
            loadMineInfo(true);
        } else toast(errorText(r.error), 'error');
    } finally {
        __miningBusy = false;
        setTimeout(() => { window.__adBusy = false; }, 1500);
        paintMining();
    }
}

function adGapRemainingMs(ui) {

        if (S2S_NETWORKS.has(network)) {
            await apiPost('earn', { action: 'adIntent', purpose: 'earn' }); // tells the server this Special ad is a normal Earn ad (not mining)
            await showFn();   // resolves only after Adsgram says the ad was watched; the server (not this phone) pays
            const ui = AD_NETWORKS_UI.find(n => n.id === network);
            await waitForS2sReward({ counterField: ui.counterField, reward: ui.reward, anchorEl: document.querySelector(`button[data-network="${network}"]`), icon: ui.icon });
            return;
        }
        const startRes = await apiPost('earn', { action: 'adStart', network });
        if (!startRes.ok) { toast(errorText(startRes.error), 'error'); return; }
        // ⚠️ NEW (ads update) — measure how long the ad was REALLY on screen
        // (SDK call → SDK promise resolves). Sent to the server, which rejects
        // anything shorter than that network's minWatchSeconds.
        const shownAt = Date.now();
        await showFn();
        const viewMs = Date.now() - shownAt;
        await creditAdReward(network, startRes.startTime, startRes.signature, viewMs);
    } catch (e) {
        // A network-specific, explicit message — a different network's ad is
        // never played instead; on failure the user is told directly to try
        // again or pick a different option.
        toast(`${networkLabel} ad isn't available right now. Please try again or pick a different network.`, 'error');
    }
}

async function creditAdReward(network, startTime, signature, viewMs) {
    let r = await apiPost('earn', { action: 'claimAdReward', network, startTime, signature, viewMs });
    // GigaPub is confirmed by its server's postback, which can land a moment AFTER the ad closes → retry a few times
    if (!r.ok && r.error === 'postback_pending') {
        toast('Confirming your reward…', 'info');
        for (let i = 0; i < 8 && !r.ok && r.error === 'postback_pending'; i++) {
            await new Promise(res => setTimeout(res, 1500));
            r = await apiPost('earn', { action: 'claimAdReward', network, startTime, signature, viewMs });
        }
    }
    if (r.ok) {
        toast(`+${r.reward} GM coin added!`, 'success');
        triggerBurst(document.querySelector(`button[data-network="${network}"]`));
        showCongrats(`+${r.reward} GM coin`, '📺', `≈ $${wtcToUsd(r.reward)} USD`);
        await refreshUser();
        if (state.activeTab === 'task') paintTaskTop();
    } else { toast(errorText(r.error), 'error'); }
}

    window.__adBusy = true;

}

function taskHubTotals(u) {
    let earned = 0, watched = 0, total = 0, maxReward = 0;
    AD_NETWORKS_UI.forEach(n => {
        const c = Math.min(u[n.counterField] || 0, n.limit);
        earned += c * n.reward; watched += c; total += n.limit; maxReward = Math.max(maxReward, n.reward);
    });
    if (ADSGRAM_TASK_BLOCK_IDS.length) {
        earned += Math.min(u.adsgramTaskCountToday || 0, ADSGRAM_TASK_LIMIT_UI) * ADSGRAM_TASK_REWARD_UI;
    }
    return { earned, watched, total, left: Math.max(0, total - watched), maxReward, pct: total ? Math.round((watched / total) * 100) : 0 };
}

function goToTask(taskId, url, category, verifyType) {
    // Open the link first
    if (url) window.open(url, '_blank');

    const task = state.tasks.find(t => t._id === taskId);
    // any category can be API-verified (Telegram join) via verifyType
    const isVerified = verifyType === 'api';
    const isUsdt = task?.rewardCurrency === 'usdt';
    const rewardTxt = '+' + (isUsdt ? (task?.rewardUsdt ?? 0) : (task?.rewardWtc || 0)) + ' ' + (isUsdt ? 'USDT' : 'GM coin');
    const WAIT_MS = 4000; // 4s duration — mirrors TASK_MIN_WAIT_SECONDS (lib/constants.js); the SERVER enforces it
    const root = document.getElementById('modal-root');

    // Centered popup card (no more bottom slide-up sheet): 4s ring → then the Claim / Verify button appears in the middle.
    root.innerHTML = `
        <div class="tkm-overlay" onclick="if(event.target===this)this.remove()">
            <div class="tkm-card">
                <div class="tkm-ring" id="tkm-ring">
                    <svg width="84" height="84" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="39"/><circle class="fg" cx="42" cy="42" r="39"/></svg>
                    <div class="tkm-ring-in" id="tkm-num">…</div>
                </div>
                <div class="tkm-name">${esc(task?.title || 'Task')}</div>
                <div class="tkm-reward">${esc(rewardTxt)}</div>
                <div class="tkm-hint" id="tkm-hint">Getting ready…</div>
                <div id="tkm-slot"></div>
                <button class="tkm-cancel" onclick="document.getElementById('modal-root').innerHTML=''">Cancel</button>
            </div>
        </div>`;

    const ring = document.getElementById('tkm-ring');
    const num = document.getElementById('tkm-num');
    const hint = document.getElementById('tkm-hint');
    const slot = document.getElementById('tkm-slot');

    // the 4s count starts only once the server-signed start token is in hand (non-API tasks),
    // so the client never finishes "before" the server's own 4s clock.
    let taskToken = null;
    const runCountdown = () => {
        if (!ring.isConnected) return;
        ring.classList.add('run');
        hint.textContent = isVerified ? 'Join the channel/group, then verify.' : 'Complete the task — your claim unlocks in a moment.';
        const t0 = Date.now();
        const tick = setInterval(() => {
            if (!ring.isConnected) { clearInterval(tick); return; }
            const left = WAIT_MS - (Date.now() - t0);
            if (left > 0) { num.textContent = Math.ceil(left / 1000); return; }
            clearInterval(tick);
            ring.classList.remove('run'); ring.classList.add('done');
            num.textContent = '✓';
            hint.textContent = isVerified ? 'Done joining? Tap Verify.' : 'All set! Tap Claim to get your reward.';
            slot.innerHTML = isVerified
                ? '<button class="tkm-act verify" id="tkm-act">✅ Verify Membership</button>'
                : '<button class="tkm-act" id="tkm-act">🎁 Claim Reward</button>';
            const act = document.getElementById('tkm-act');
            act.onclick = async () => {
                act.disabled = true;
                act.textContent = 'Checking...';
                await completeTask(taskId, taskToken);
            };
        }, 100);
    };

    if (isVerified) {
        runCountdown(); // API-verified tasks are proven by real Telegram membership — no start token needed
    } else {
        apiPost('earn', { action: 'taskStart', taskId }).then(r => {
            if (!ring.isConnected) return;
            if (r?.ok) { taskToken = { startTime: r.startTime, signature: r.signature }; runCountdown(); }
            else { document.getElementById('modal-root').innerHTML = ''; toast(errorText(r?.error), 'error'); }
        });
    }
}

async function completeTask(taskId, taskToken) {
    const r = await apiPost('earn', { action: 'taskComplete', taskId, startTime: taskToken?.startTime, signature: taskToken?.signature });
    document.getElementById('modal-root').innerHTML = ''; // close sheet
    if (r.ok) {
        toast(`+${r.rewardWtc} GM coin added!`, 'success');
        triggerBurst(document.querySelector(`button[data-task="${taskId}"]`) || document.body);
        showCongrats(`+${r.rewardWtc} GM coin`, '✅', `≈ $${wtcToUsd(r.rewardWtc)} USD`);
        await refreshUser();

        // 20 Oct 2026 (admin): the card-vanish animation was removed — the list just refreshes right away.
        if (state.activeTab === 'task') renderTaskTab();
    }
    else if (r.alreadyDone) { toast('You already completed this task.', 'info'); }
    else if (r.error === 'not_member') { toast('Not a member yet — join first, then verify.', 'error'); }
    else { toast(errorText(r.error), 'error'); }
}

// ⚠️ NEW — "Create Task" button (Task tab). A user pays TON to publish
// their OWN task into the ⭐ Exclusive section. Payment is verified fully
// server-side/on-chain (api/payments.js (cron=checkDeposits)) — this modal
// only collects the task details, creates the order, and polls its
// status; it never inserts the task itself. Structurally mirrors
// openBuyValidReferModal (same payment-waiting screen shape), plus a
// list screen (existing created tasks + progress) and a details-form
// screen in front of it.
async function openCreateTaskModal() {
    let pollTimer = null;
    let countdownTimer = null;
    let closed = false;
    let order = null;
    const formData = { verifyType: 'api', channelUsername: '', url: '', title: '', package: '100', verified: '' };

    function stopTimers() {
        if (pollTimer) clearInterval(pollTimer);
        if (countdownTimer) clearInterval(countdownTimer);
    }
    function close(refreshTasks) {
        if (closed) return;
        closed = true;
        stopTimers();
        document.getElementById('modal-root').innerHTML = '';
        if (refreshTasks && state.activeTab === 'task') renderTaskTab();
    }
    window.__closeCreateTask = close;

    // ── screens 1+2: ONE sheet with two tabs — "New Task" (form) + "My Tasks" (history) ──
    // ⚠️ REDESIGNED — channel/group tasks now require a server-side "Verify bot"
    // step (payments?resource=taskcreate action=verifyBot) BEFORE the user can
    // pay, so nobody pays TON for a task that can never be verified.
    function normChannel(v) {
        let s = String(v || '').trim();
        const m = s.match(/t\.me\/([a-zA-Z0-9_]+)/);
        if (m) s = m[1];
        return s.replace(/^@/, '').toLowerCase();
    }
    function captureFormFields() {
        const ch = document.getElementById('ct-channel'); if (ch) formData.channelUsername = ch.value;
        const url = document.getElementById('ct-url'); if (url) formData.url = url.value;

    function renderForm() { renderMain('new'); }

    async function paintHistory() {
        const body = document.getElementById('ct-hist');

        if (!host) return; // modal closed / tab switched before this resolved

                    <div class="ct-hname">${esc(t.title)}</div>
                    <div class="ct-hstat mono-num" style="color:${isDone ? 'var(--success)' : 'var(--ink-muted)'};">${done}/${limit}${isDone ? ' ✅' : ''}</div>

            <div class="ct-pkgs">

                        ${BADGES[count] ? `<span class="ct-badge">${BADGES[count]}</span>` : ''}
                        <span class="ct-pkg-n">${Number(count).toLocaleString('en-US')}</span>

                    <div class="sheet-handle"></div>

                    </div>
                    ${isNew ? formHtml : `<div id="ct-hist"><div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div><div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div></div>`}

            </div>`;

        document.getElementById('ct-x').onclick = () => close();

        if (!isNew) { paintHistory(); return; }

        document.querySelectorAll('[data-vtype]').forEach(b => b.onclick = () => { captureFormFields(); formData.verifyType = b.dataset.vtype; renderMain('new'); });
        document.querySelectorAll('[data-pkg]').forEach(b => b.onclick = () => { captureFormFields(); formData.package = b.dataset.pkg; renderMain('new'); });
        document.getElementById('ct-submit').onclick = submitForm;

        if (isApi) {
            // typing a different username after verifying invalidates the ✓ right away
            document.getElementById('ct-channel').oninput = (e) => {
                const stillOk = !!formData.verified && formData.verified === normChannel(e.target.value);
                const vb = document.getElementById('ct-verify'); const nt = document.getElementById('ct-note');
                if (!vb || !nt) return;
                vb.classList.toggle('ok', stillOk);
                vb.textContent = stillOk ? '✓ Verified' : 'Verify bot';

                else { formData.verified = ''; toast(errorText(r.error), 'error'); }
                renderMain('new');
            };
        }
    }

    async function submitForm() {
        captureFormFields();
        formData.title = formData.title.trim();
        if (!formData.title) return toast('Please enter a task title.', 'error');
        if (formData.verifyType === 'api') {
            const ch = normChannel(formData.channelUsername);
            if (!ch) return toast('Please enter a channel/group username.', 'error');
            if (formData.verified !== ch) return toast('Tap "Verify bot" first — the bot must be admin there.', 'error');
        }
        if (formData.verifyType === 'link' && !formData.url.trim()) return toast('Please enter a link.', 'error');

        const btn = document.getElementById('ct-submit');
        const idleLabel = btn.textContent;
        btn.textContent = 'Creating order...';
        btn.disabled = true;
        const r = await apiPost('payments', {
            resource: 'taskcreate',
            action: 'create',
            package: formData.package,
            title: formData.title,
            verifyType: formData.verifyType,
            channelUsername: formData.channelUsername,
            url: formData.url,
        });
        if (!document.getElementById('ct-submit')) return; // modal closed before this resolved
        if (!r.ok) {
            toast(errorText(r.error), 'error');
            btn.textContent = idleLabel;
            btn.disabled = false;
            return;
        }
        order = r.order;
        renderPay();
    }

    // ── screen 3: payment (mirrors openBuyValidReferModal's waiting screen) ──
    function renderPay() {
        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this){window.__closeCreateTask?.();}">
                <div class="sheet anim-in" style="max-height:88vh; overflow-y:auto;">
                    <div class="sheet-handle"></div>
                    <div class="section-title" style="margin-bottom:2px;">💳 Pay to Publish</div>
                    <div class="muted" style="font-size:12px; margin-bottom:14px;">${order.taskCount} people will be able to complete this task.</div>

                    <div class="card" style="padding:14px; margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <span class="muted" style="font-size:12px;">Amount</span>
                            <span class="mono-num" style="font-size:15px; font-weight:700;">${(order.amountNanoTon / 1_000_000_000).toFixed(4)} TON</span>
                        </div>
                        <div class="field-label" style="margin-top:0;">Send to this address</div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <div class="mono-num" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; background:var(--surface-raised); padding:9px 10px; border-radius:8px;">${order.address}</div>
                            <button class="btn btn-outline" id="ct-copy-addr" style="width:auto; padding:0 12px;">Copy</button>
                        </div>
                        <div class="field-label">Comment / Memo — <span style="color:var(--pending);">must include exactly</span></div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <div class="mono-num" style="flex:1; font-size:15px; font-weight:700; letter-spacing:1px; background:var(--surface-raised); padding:9px 10px; border-radius:8px; text-align:center;">${order.memo}</div>
                            <button class="btn btn-outline" id="ct-copy-memo" style="width:auto; padding:0 12px;">Copy</button>
                        </div>
                        <div class="muted" style="font-size:11px; margin-top:8px; line-height:1.5;">⚠️ Without this exact comment, we can't tell the payment is yours and your task won't be published automatically.</div>
                    </div>

                    <button id="ct-open-tonkeeper" class="btn btn-primary" style="width:100%; display:flex; align-items:center; justify-content:center;">Open in Tonkeeper</button>

                    <div style="text-align:center; margin-top:16px;">
                        <div id="ct-status-line" style="font-size:13px; color:var(--pending); display:flex; align-items:center; justify-content:center; gap:6px;">
                            <span style="width:12px; height:12px; border-radius:50%; border:2px solid var(--pending); border-top-color:transparent; display:inline-block; animation:spin 0.8s linear infinite;"></span>
                            Waiting for payment...
                        </div>
                        <div id="ct-countdown" class="muted" style="font-size:11.5px; margin-top:6px;"></div>
                    </div>

                    <button class="btn btn-outline" id="ct-cancel" style="width:100%; margin-top:14px; font-size:12.5px;">Cancel order</button>
                </div>
            </div>`;

        document.getElementById('ct-copy-addr').onclick = () => { navigator.clipboard.writeText(order.address); toast('Address copied!', 'success'); };
        document.getElementById('ct-copy-memo').onclick = () => { navigator.clipboard.writeText(order.memo); toast('Memo copied!', 'success'); };
        document.getElementById('ct-open-tonkeeper').onclick = () => openTonkeeperLink(order.deepLink);
        document.getElementById('ct-cancel').onclick = async () => {
            stopTimers();
            await apiPost('payments', { resource: 'taskcreate', action: 'cancel', orderId: order.id });
            toast('Order cancelled.', 'info');
            close();
        };

        startCountdown();
        startPolling();
    }

    function startCountdown() {
        const expiresAt = new Date(order.expiresAt).getTime();
        const tick = () => {
            const el = document.getElementById('ct-countdown');
            if (!el) { clearInterval(countdownTimer); return; }
            const msLeft = expiresAt - Date.now();
            if (msLeft <= 0) {
                el.textContent = 'Expired';
                clearInterval(countdownTimer);
                return;
            }
            const mm = Math.floor(msLeft / 60000);
            const ss = Math.floor((msLeft % 60000) / 1000);
            el.textContent = `Auto-cancels in ${mm}:${String(ss).padStart(2, '0')} if unpaid`;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    function startPolling() {
        pollTimer = setInterval(async () => {
            const s = await apiGet(`payments?resource=taskcreate&action=status&orderId=${order.id}&initData=${encodeURIComponent(TG_INIT_DATA)}`);
            if (!document.getElementById('ct-status-line')) { clearInterval(pollTimer); return; } // modal closed
            if (!s.ok) return; // transient error — just try again next tick
            if (s.status === 'paid') {
                stopTimers();
                triggerBurst(document.getElementById('modal-root'));
                showCongrats('Payment Confirmed!', '⏳');
                toast('Payment confirmed — your task is now pending admin review.', 'success');
                setTimeout(() => close(true), 1200);
            } else if (s.status === 'expired') {
                stopTimers();
                document.getElementById('modal-root').innerHTML = `
                    <div class="overlay" onclick="if(event.target===this)this.remove()">
                        <div class="sheet anim-in">
                            <div class="sheet-handle"></div>
                            <div style="text-align:center; padding:20px 0;">
                                <div style="font-size:34px; margin-bottom:10px;">⌛</div>
                                <div style="font-weight:600; margin-bottom:6px;">Order expired</div>
                                <div class="muted" style="font-size:12.5px; line-height:1.55; margin-bottom:16px;">No payment was detected within ${TASK_CREATE_ORDER_EXPIRY_MIN_DISPLAY} minutes.<br><b>If you already sent the TON, do NOT pay again</b> — it is credited automatically within a few minutes of the network confirming it, and you will get a Telegram message. If nothing arrives, contact support with your transaction hash.</div>
                                <button class="btn btn-primary" id="ct-retry" style="width:100%;">Try again</button>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('ct-retry').onclick = renderForm;
            }
        }, 4000);
    }

    renderMain('new');
}

    document.getElementById('ip-retry-btn').onclick = () => { location.reload(); };

            // ⚠️ CHANGED — prefer the friendly r.message (e.g. the new

            toast(r?.message || r?.error || 'Could not switch account', 'error');
            e.target.disabled = false;
            e.target.textContent = 'Switch account (resets my balance)';
        }
    };
}

async function refreshUser() {
    const r = await apiGet(`user?action=profile&initData=${encodeURIComponent(TG_INIT_DATA)}`);
    if (r.ok) {
        state.user = r.user;
        // Ban gate — if user is banned, show ban screen and stop everything
        if (r.user?.isBanned) {
            document.getElementById('app-root').innerHTML = '';
            const appealUrl = `https://t.me/NewTube12_bot?start=appeal_${USER_ID}`;
            document.getElementById('modal-root').innerHTML = `

        }

    }

    // if everything succeeded. Now it throws, so init()'s catch block below
    // can show a real "connection failed, tap to retry" screen instead of
    // either hanging or silently rendering a broken/empty app.
    throw new Error(r.error === 'timeout' ? 'connection_timeout' : 'connection_failed');
}

            if (finished) return; finished = true;

            if (!dragging) return; dragging = false;

            if (dx < -w * 0.18) go(idx + 1); else if (dx > w * 0.18) go(idx - 1); else go(idx);
        };
        vp.addEventListener('pointerup', endDrag); vp.addEventListener('pointercancel', endDrag); vp.addEventListener('pointerleave', endDrag);

        requestAnimationFrame(() => requestAnimationFrame(() => go(0)));

async function init() {
    const splashStart = performance.now();

    // ── Telegram-only gate ── matches the original app's behavior: wait briefly
    // for Telegram's WebApp bridge to deliver initData, and if it never does
    // (because this was opened in a regular browser, not via Telegram), block
    // entirely instead of silently falling back to a fake/demo identity.
    if (!hydrateDisplayUserFields()) {
        await new Promise(r => setTimeout(r, 800));
        if (!hydrateDisplayUserFields()) {
            await new Promise(r => setTimeout(r, 1500));
        }
    }
    if (!TG_INIT_DATA || !hydrateDisplayUserFields()) {
        document.getElementById('splash').remove();
        document.getElementById('app-root').innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; text-align:center; padding:0 30px;">
                <div style="font-size:48px;">📱</div>
                <div style="font-family:var(--font-display); font-weight:700; font-size:17px;">Open this in Telegram</div>
                <div class="muted" style="font-size:13px; line-height:1.6;">GameVo Mine only works inside the Telegram app. Please open it via the GameVo Mine bot.</div>
            </div>`;
        return;
    }

    const initRes = await apiPost('user', { action: 'init', fingerprint: await generateDeviceFingerprint() });
    if (initRes && initRes.ok === false && initRes.error === 'ip_in_use') {
        const splashEl = document.getElementById('splash');
        if (splashEl) splashEl.remove();
        showIpInUseScreen(initRes.owner);
        return;
    }
    // ⚠️ FIX — any OTHER init failure (timeout, 500, cold-start DB error, etc.)
    // used to be silently ignored here — execution just carried on into
    // refreshUser() as if init had succeeded. Now any non-ip_in_use failure
    // goes straight to the retry screen instead of limping forward.
    if (!initRes || initRes.ok === false) {
        showConnectionErrorScreen();
        return;
    }
    try {
        await refreshUser();
    } catch (e) {
        if (e.message === 'banned') {
            // Ban screen already shown in refreshUser() — remove splash and stop
            const splash = document.getElementById('splash');
            if (splash) { splash.classList.add('out'); setTimeout(() => splash.remove(), 550); }
            return;
        }
        // ⚠️ FIX — connection_timeout / connection_failed / any other unexpected
        // error now shows a visible retry screen instead of either hanging on
        // the static "92%" splash forever (old timeout-less fetch) or, if it
        // did resolve, silently proceeding with no user data and breaking
        // downstream renders with no explanation to the user.
        showConnectionErrorScreen();
        return;
    }

    // Splash stays at least SPLASH_MIN_MS so the whole pickaxe → strike → gem → logo → loading animation is always seen,
    // even when the network is fast. Then the bar snaps to 100% and the splash fades out.
    const SPLASH_MIN_MS = 3300;
    const elapsed = performance.now() - splashStart;
    if (elapsed < SPLASH_MIN_MS) await new Promise(r => setTimeout(r, SPLASH_MIN_MS - elapsed));
    if (window.__splashFinish) window.__splashFinish();
    await new Promise(r => setTimeout(r, 350));
    const splash = document.getElementById('splash');
    splash.classList.add('out');
    setTimeout(() => splash.remove(), 550);

    // The ONLY gate after opening the app is the channel/community join check
    // (the welcome ticket + Terms & Conditions screens were removed per admin request).
    // Opening slides first (the join-check request runs in the background meanwhile, so no time is lost).
    const joinCheckP = apiGet(`user?action=checkJoin&initData=${encodeURIComponent(TG_INIT_DATA)}`);
    joinCheckP.catch(() => {});
    if (!onboardingSeen()) { try { await showOnboarding(); } catch (e) { console.warn('onboarding failed', e); } }
    const joinCheck = await joinCheckP;
    if (joinCheck.joined) startApp();
    else showJoinGate({ leftAfterVerifying: joinCheck.leftAfterVerifying }, startApp);
}

function startApp() {
    renderShell();
    switchTab('home');
    startJoinWatcher();
    setTimeout(checkPendingGift, 900);
    maybeShowAppOpenAdsgram(); // 18 Oct 2026: no longer shows an ad (app-open ad removed) — only marks the app as started. // after the splash/home entrance animation, so the two don't show at once
}

// ⚠️ FIX — pure canvas+screen+locale+timezone+cores fingerprinting collides
// across DIFFERENT physical devices when the hardware/software is common
// (same cheap Android model, same GPU, same Asia/Dhaka timezone, same bn/en
// locale — exactly the typical profile for our user base). That made the
// "device already in use" gate hard-block genuinely different people on
// genuinely different phones, which is what was being reported as false
// account suspensions.
//
// Fix: mix in a random, install-scoped ID that's generated once and
// persisted in localStorage. This is the dominant entropy source now — two
// physically identical phones will still get different fingerprints because
// each one rolled its own random ID on first launch. localStorage clears if
// the user clears app data / reinstalls, which starts a "new device" for
// gating purposes — same trade-off every app with this pattern accepts.
function getOrCreateInstallId() {
    try {
        const KEY = 'nt_install_id';
        let id = localStorage.getItem(KEY);
        if (!id) {
            id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
            localStorage.setItem(KEY, id);
        }
        return id;
    } catch { return ''; } // localStorage unavailable — falls back to the weaker hardware-only signal below
}

async function generateDeviceFingerprint() {
    try {
        const parts = [];
        parts.push(getOrCreateInstallId()); // dominant entropy source, see note above
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 200; canvas.height = 50;
        ctx.textBaseline = 'top'; ctx.font = '14px Arial'; ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 100, 20);
        ctx.fillStyle = '#069'; ctx.fillText('NEWTUBE-fp', 2, 15);
        parts.push(canvas.toDataURL());
        parts.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
        parts.push(navigator.language || '');
        parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
        parts.push(navigator.hardwareConcurrency || '');
        const data = new TextEncoder().encode(parts.join('|||'));
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch { return null; }
}

// ⚠️ NEW — absolute last-resort safety net. If ANY future script (ad SDK or
// otherwise) ever blocks parsing again, or init() throws something not
// caught above, this guarantees the user is never stuck on the static "92%"
// splash forever — after 20s, if the splash is still there, force the
// connection-error/retry screen.
setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash && !splash.classList.contains('out')) showConnectionErrorScreen();
}, 20000);

init();
</script>
