// ══════════════════════════════════════════════════════════════
// API helpers — apiPost automatically attaches the signed Telegram
// initData to every request, so individual call sites never need to
// (and never should) pass a raw userId — the server derives it from
// the verified session instead.
// ⚠️ FIX — fetch() previously had NO timeout, so on a slow/dead mobile
// connection this could hang forever, leaving the user stuck on the splash
// screen's static "92%" bar with zero feedback and no way to recover short
// of force-closing the app. Now every call aborts after API_TIMEOUT_MS and
// resolves to {ok:false, error:'timeout'} instead of hanging indefinitely.
// ══════════════════════════════════════════════════════════════
const API_TIMEOUT_MS = 30000;   // 22 Oct 2026: 15s -> 30s (slow VPN / cold start was timing out)
async function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
    try {
        return await fetch(url, { ...options, signal: controller.signal });
    } finally { clearTimeout(t); }
}
async function apiPost(path, body = {}) {
    try {
        const res = await fetchWithTimeout(`${API_BASE}/${path}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...body, initData: TG_INIT_DATA }),
        });
        let data;
        try { data = await res.json(); }
        catch (e) { return { ok: false, error: 'server_error', status: res.status }; }   // server sent a non-JSON page (Vercel crash page)
        return data;
    } catch (e) { return { ok: false, error: e?.name === 'AbortError' ? 'timeout' : 'network_error' }; }
}
async function apiGet(path) {
    try {
        const res = await fetchWithTimeout(`${API_BASE}/${path}`);
        try { return await res.json(); } catch (e) { return { ok: false, error: 'server_error', status: res.status }; }
    } catch (e) { return { ok: false, error: e?.name === 'AbortError' ? 'timeout' : 'network_error' }; }
}

// ══════════════════════════════════════════════════════════════
// PARTICLE BURST — lightweight canvas confetti for reward moments
// (ad reward, task complete, promo redeem).
// Self-contained, auto-clears after ~1s — never blocks interaction.
// ══════════════════════════════════════════════════════════════
const burstCanvas = document.getElementById('burst-canvas');
const burstCtx = burstCanvas.getContext('2d');
function resizeBurstCanvas() { burstCanvas.width = window.innerWidth; burstCanvas.height = window.innerHeight; }
resizeBurstCanvas();
window.addEventListener('resize', resizeBurstCanvas);

function triggerBurst(originEl) {
    const rect = originEl ? originEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    const colors = ['#2E86FF', '#1E6BFF', '#4F7CFF', '#5CC8FF'];
    const particles = Array.from({ length: 26 }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 4.5;
        return { x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1 };
    });
    let frame = 0;
    function tick() {
        frame++;
        burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
        let alive = false;
        particles.forEach(p => {
            if (p.life <= 0) return;
            p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life -= 0.022;
            if (p.life > 0) {
                alive = true;
                burstCtx.globalAlpha = Math.max(p.life, 0);
                burstCtx.fillStyle = p.color;
                burstCtx.beginPath(); burstCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); burstCtx.fill();
            }
        });
        burstCtx.globalAlpha = 1;
        if (alive && frame < 90) requestAnimationFrame(tick);
        else burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
    }
    tick();
}

// COUNT-UP — animates a number from its current value to a new target
// ══════════════════════════════════════════════════════════════
function animateCountUp(el, from, to, duration = 700) {
    if (!el) return;
    const start = performance.now();
    const diff = to - from;
    function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = fmtWTC(from + diff * eased);
        if (t < 1) requestAnimationFrame(step);
        else el.textContent = fmtWTC(to);
    }
    requestAnimationFrame(step);
}

function getRankInfo(u) {

async function redeemPromoCode(code, btn, onSuccess) {
    if (!code) return toast('Please enter a code.', 'error');
    const originalLabel = btn.textContent;
    btn.textContent = 'Please wait...'; btn.disabled = true;

    // ⚠️ NEW — validate the code BEFORE showing an ad. Previously the ad
    // played no matter what, so an invalid/expired/already-used code still
    // cost the user a full ad watch before telling them it failed. This
    // check doesn't spend the code (see handleCheckPromo in api/earn.js) —
    // the real, atomic redemption still happens after the ad, below.
    const check = await apiPost('earn', { action: 'checkPromo', code });
    if (!check.ok) {
        toast(errorText(check.error), 'error');
        btn.textContent = originalLabel; btn.disabled = false;
        return;
    }

    const r = await apiPost('earn', { action: 'claimPromo', code });
    if (r.ok) {
        // 16 Oct 2026 — celebrate IMMEDIATELY; the balance refresh runs in the background (it used to be awaited first = extra waiting)
        onSuccess?.();
        showCongrats(`+${r.reward} GM coin`, '🎁', `≈ $${wtcToUsd(r.reward)} USD`);
        refreshUser().then(() => { if (state.activeTab === 'mining') renderMining(); }).catch(() => {});
        return;
    }
    toast(errorText(r.error), 'error');
    btn.textContent = originalLabel; btn.disabled = false;
}

// live countdown for Mining: 01:59:07 (ticks every second)
function fmtHMS(ms) {
    const t = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}
function fmtCooldown(ms) {
    const totalMin = Math.ceil(ms / 60000);
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

    set('mn-bal-num', fmtWTC((state.user && state.user.wtcBalance) || 0));
    paintMineBoost();
    paintMineLevels();
    const C = 553, ms = miningRemainingMs();
    if (__miningBusy) { sub.textContent = 'Working…'; badge.textContent = '…'; btn.disabled = true; btn.textContent = 'Collecting…'; return true; }
    if (ms <= 0) {
        badge.textContent = 'READY'; sub.textContent = 'Your miner is full';
        if (ring) ring.style.strokeDashoffset = '0';
        btn.disabled = false; btn.textContent = '⛏️  Collect +' + reward + ' GM coin';
        if (hero) hero.classList.add('is-ready');
    } else {
        badge.textContent = fmtHMS(ms); sub.textContent = 'until next collect';
        if (ring) ring.style.strokeDashoffset = String(Math.round(C * (ms / MINING_COOLDOWN_MS)));
        btn.disabled = true; btn.textContent = 'Mining… ' + Math.round((1 - ms / MINING_COOLDOWN_MS) * 100) + '%';
        if (hero) hero.classList.remove('is-ready');
    }
    return true;
}
function startMiningTicker() {

async function startMiningCollect() {
    if (__miningBusy) return;
    const ms = miningRemainingMs();
    if (ms > 0) { toast('Mining ready in ' + fmtHMS(ms) + '.', 'info'); return; }
    __miningBusy = true; paintMining();

        if (r.ok) {
            state.user = Object.assign({}, state.user, { wtcBalance: r.balance, lifetimeWtcEarned: r.lifetime, lastMineAt: r.lastMineAt, lifetimeMined: ((state.user && state.user.lifetimeMined) || 0) + 1 });
            toast('+' + r.reward + ' GM coin mined!', 'success');
            showCongrats('+' + r.reward + ' GM coin', '⛏️', '≈ $' + wtcToUsd(r.reward) + ' USD');

}

    if (!state.tasksAt || Date.now() - state.tasksAt > 5 * 60 * 1000) {
        const r = await apiGet('data?type=tasks');
        if (r.ok) { state.tasks = r.tasks; state.tasksAt = Date.now(); } else state.tasks = state.tasks || [];
    }
    const done = new Set(state.user?.completedTasks || []);
    const listEl = document.getElementById('task-page-list');
    if (!listEl) return; // tab changed while this was loading

    // completed tasks vanish from the list (animation handled in completeTask)
    const open = state.tasks.filter(t => !done.has(t._id) && (t.category || 'partner') !== 'daily' && (t.category || 'partner') !== 'channel');
    const items = state.taskSubTab === 'all' ? open : open.filter(t => (t.category || 'partner') === state.taskSubTab);
    const countEl = document.getElementById('tk-count'); if (countEl) countEl.textContent = items.length;
    const openEl = document.getElementById('tk-open-count'); if (openEl) openEl.textContent = open.length;

    if (!items.length) {
        listEl.innerHTML = `<div class="muted" style="text-align:center; padding:20px 0;">No tasks in this category right now — check back later.</div>`;
        return;
    }
    listEl.innerHTML = items.map(t => taskCardHtml(t)).join('');
    listEl.querySelectorAll('button[data-task]').forEach(btn => { btn.onclick = () => goToTask(btn.dataset.task, btn.dataset.url, btn.dataset.category, btn.dataset.verify); });
}

// meta per category: icon, badge text, and the CSS hue vars from the theme
// (see the --daily-hue/--exclusive-hue/etc. block up top).
const TASK_CATEGORY_META = {
    channel:   { icon: '📢', badge: '✓ Verified', hue: 'var(--task-hue)',      hueSoft: 'var(--task-soft)' },
    daily:     { icon: '📅', badge: 'Daily',       hue: 'var(--daily-hue)',     hueSoft: 'var(--daily-soft)' },
    exclusive: { icon: '⭐', badge: 'Exclusive',   hue: 'var(--exclusive-hue)', hueSoft: 'var(--exclusive-soft)' },
    partner:   { icon: '🤝', badge: 'Partner',     hue: 'var(--partner-hue)',   hueSoft: 'var(--partner-soft)' },
    earning:   { icon: '👥', badge: 'Community',     hue: 'var(--earning-hue)',   hueSoft: 'var(--earning-soft)' },
};

function taskCardHtml(t) {
    const cat = t.category || 'partner';
    const m = TASK_CATEGORY_META[cat] || TASK_CATEGORY_META.partner;
    // verifyType is independent of category (any category can be API-verified via Telegram join)
    const verifyType = t.verifyType || (cat === 'channel' ? 'api' : 'link');
    const isUsdt = t.rewardCurrency === 'usdt';
    const rewardAmount = isUsdt ? (t.rewardUsdt ?? 0) : (t.rewardWtc || 0);
    const rewardUnit = isUsdt ? 'USDT' : 'GM coin';
    return `
    <div class="tk-row anim-in" data-task-card="${t._id}" style="--h:${m.hue}; --hs:${m.hueSoft};">
        <div class="tk-ic">${m.icon}</div>
        <div class="tk-mid">
            <div class="tk-title">${esc(t.title)}</div>
            <div class="tk-meta"><span class="tk-reward">+${rewardAmount} ${rewardUnit}</span><span class="tk-tag">${m.badge}</span></div>
        </div>
        <button class="tk-go" data-task="${t._id}" data-url="${t.url || ''}" data-category="${cat}" data-verify="${verifyType}">GO <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>`;
}

function goToTask(taskId, url, category, verifyType) {
    // Open the link first
    if (url) window.open(url, '_blank');

    const task = state.tasks.find(t => t._id === taskId);
    // any category can be API-verified (Telegram join) via verifyType
    const isVerified = verifyType === 'api';
    const isUsdt = task?.rewardCurrency === 'usdt';
    const rewardTxt = '+' + (isUsdt ? (task?.rewardUsdt ?? 0) : (task?.rewardWtc || 0)) + ' ' + (isUsdt ? 'USDT' : 'GM coin');
    const WAIT_MS = 4000; // 4s duration — mirrors TASK_MIN_WAIT_SECONDS (lib/constants.js); the SERVER enforces it
    const root = document.getElementById('modal-root');

    // Centered popup card (no more bottom slide-up sheet): 4s ring → then the Claim / Verify button appears in the middle.
    root.innerHTML = `
        <div class="tkm-overlay" onclick="if(event.target===this)this.remove()">
            <div class="tkm-card">
                <div class="tkm-ring" id="tkm-ring">
                    <svg width="84" height="84" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="39"/><circle class="fg" cx="42" cy="42" r="39"/></svg>
                    <div class="tkm-ring-in" id="tkm-num">…</div>
                </div>
                <div class="tkm-name">${esc(task?.title || 'Task')}</div>
                <div class="tkm-reward">${esc(rewardTxt)}</div>
                <div class="tkm-hint" id="tkm-hint">Getting ready…</div>
                <div id="tkm-slot"></div>
                <button class="tkm-cancel" onclick="document.getElementById('modal-root').innerHTML=''">Cancel</button>
            </div>
        </div>`;

    const ring = document.getElementById('tkm-ring');
    const num = document.getElementById('tkm-num');
    const hint = document.getElementById('tkm-hint');
    const slot = document.getElementById('tkm-slot');

    // the 4s count starts only once the server-signed start token is in hand (non-API tasks),
    // so the client never finishes "before" the server's own 4s clock.
    let taskToken = null;
    const runCountdown = () => {
        if (!ring.isConnected) return;
        ring.classList.add('run');
        hint.textContent = isVerified ? 'Join the channel/group, then verify.' : 'Complete the task — your claim unlocks in a moment.';
        const t0 = Date.now();
        const tick = setInterval(() => {
            if (!ring.isConnected) { clearInterval(tick); return; }
            const left = WAIT_MS - (Date.now() - t0);
            if (left > 0) { num.textContent = Math.ceil(left / 1000); return; }
            clearInterval(tick);
            ring.classList.remove('run'); ring.classList.add('done');
            num.textContent = '✓';
            hint.textContent = isVerified ? 'Done joining? Tap Verify.' : 'All set! Tap Claim to get your reward.';
            slot.innerHTML = isVerified
                ? '<button class="tkm-act verify" id="tkm-act">✅ Verify Membership</button>'
                : '<button class="tkm-act" id="tkm-act">🎁 Claim Reward</button>';
            const act = document.getElementById('tkm-act');
            act.onclick = async () => {
                act.disabled = true;
                act.textContent = 'Checking...';
                await completeTask(taskId, taskToken);
            };
        }, 100);
    };

    if (isVerified) {
        runCountdown(); // API-verified tasks are proven by real Telegram membership — no start token needed
    } else {
        apiPost('earn', { action: 'taskStart', taskId }).then(r => {
            if (!ring.isConnected) return;
            if (r?.ok) { taskToken = { startTime: r.startTime, signature: r.signature }; runCountdown(); }
            else { document.getElementById('modal-root').innerHTML = ''; toast(errorText(r?.error), 'error'); }
        });
    }
}

async function completeTask(taskId, taskToken) {
    const r = await apiPost('earn', { action: 'taskComplete', taskId, startTime: taskToken?.startTime, signature: taskToken?.signature });
    document.getElementById('modal-root').innerHTML = ''; // close sheet
    if (r.ok) {
        toast(`+${r.rewardWtc} GM coin added!`, 'success');
        triggerBurst(document.querySelector(`button[data-task="${taskId}"]`) || document.body);
        showCongrats(`+${r.rewardWtc} GM coin`, '✅', `≈ $${wtcToUsd(r.rewardWtc)} USD`);
        await refreshUser();

        // 20 Oct 2026 (admin): the card-vanish animation was removed — the list just refreshes right away.
        if (state.activeTab === 'task') renderTaskTab();
    }
    else if (r.alreadyDone) { toast('You already completed this task.', 'info'); }
    else if (r.error === 'not_member') { toast('Not a member yet — join first, then verify.', 'error'); }
    else { toast(errorText(r.error), 'error'); }
}

// ⚠️ NEW — "Create Task" button (Task tab). A user pays TON to publish
// their OWN task into the ⭐ Exclusive section. Payment is verified fully
// server-side/on-chain (api/payments.js (cron=checkDeposits)) — this modal
// only collects the task details, creates the order, and polls its
// status; it never inserts the task itself. Structurally mirrors
// openBuyValidReferModal (same payment-waiting screen shape), plus a
// list screen (existing created tasks + progress) and a details-form
// screen in front of it.
async function openCreateTaskModal() {
    let pollTimer = null;
    let countdownTimer = null;
    let closed = false;
    let order = null;
    const formData = { verifyType: 'api', channelUsername: '', url: '', title: '', package: '100', verified: '' };

    function stopTimers() {
        if (pollTimer) clearInterval(pollTimer);
        if (countdownTimer) clearInterval(countdownTimer);
    }
    function close(refreshTasks) {
        if (closed) return;
        closed = true;
        stopTimers();
        document.getElementById('modal-root').innerHTML = '';
        if (refreshTasks && state.activeTab === 'task') renderTaskTab();
    }
    window.__closeCreateTask = close;

    // ── screens 1+2: ONE sheet with two tabs — "New Task" (form) + "My Tasks" (history) ──
    // ⚠️ REDESIGNED — channel/group tasks now require a server-side "Verify bot"
    // step (payments?resource=taskcreate action=verifyBot) BEFORE the user can
    // pay, so nobody pays TON for a task that can never be verified.
    function normChannel(v) {
        let s = String(v || '').trim();
        const m = s.match(/t\.me\/([a-zA-Z0-9_]+)/);
        if (m) s = m[1];
        return s.replace(/^@/, '').toLowerCase();
    }
    function captureFormFields() {
        const ch = document.getElementById('ct-channel'); if (ch) formData.channelUsername = ch.value;
        const url = document.getElementById('ct-url'); if (url) formData.url = url.value;
        const title = document.getElementById('ct-title'); if (title) formData.title = title.value;
    }
    function renderForm() { renderMain('new'); }

    async function paintHistory() {
        const body = document.getElementById('ct-hist');
        if (!body) return;
        const r = await apiGet(`payments?resource=taskcreate&action=myTasks&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        const host = document.getElementById('ct-hist');
        if (!host) return; // modal closed / tab switched before this resolved
        if (!r.ok || !r.tasks?.length) {
            host.innerHTML = `<div class="muted" style="font-size:12.5px; text-align:center; padding:26px 0;">You haven't posted any tasks yet.</div>`;
            return;
        }
        host.innerHTML = r.tasks.map(t => {
            const limit = t.limit || 0;
            const done = t.completionCount || 0;
            const pct = limit ? Math.min(100, Math.round((done / limit) * 100)) : 0;
            const isDone = limit > 0 && done >= limit;
            if (t.reviewStatus === 'rejected') {
                return `<div class="ct-hrow" style="opacity:0.7;"><div class="ct-hname">${esc(t.title)}</div><div class="ct-hstat" style="color:var(--danger);">❌ Rejected</div></div>`;
            }
            if (t.reviewStatus === 'pending_review' || !t.isApproved) {
                return `<div class="ct-hrow"><div class="ct-hname">${esc(t.title)}</div><div class="ct-hstat" style="color:var(--pending);">⏳ In review</div></div>`;
            }
            return `<div class="ct-hrow" style="display:block;">
                <div style="display:flex; justify-content:space-between; gap:8px; align-items:center;">
                    <div class="ct-hname">${esc(t.title)}</div>
                    <div class="ct-hstat mono-num" style="color:${isDone ? 'var(--success)' : 'var(--ink-muted)'};">${done}/${limit}${isDone ? ' ✅' : ''}</div>
                </div>
                <div class="ct-bar"><div style="width:${pct}%;"></div></div>
            </div>`;
        }).join('');
    }

    function renderMain(tab) {
        const isNew = tab === 'new';
        const price = TASK_CREATE_PACKAGES_DISPLAY[formData.package];
        const chNorm = normChannel(formData.channelUsername);
        const isApi = formData.verifyType === 'api';
        const isVerified = isApi && !!formData.verified && formData.verified === chNorm;
        const BADGES = { '500': 'HOT', '2000': 'BEST DEAL' };

        const formHtml = `
            <div class="ct-types">
                <button class="ct-type ${isApi ? 'on' : ''}" data-vtype="api"><span class="ct-type-ic">📢</span><span><b>Channel / Group</b><small>Bot-verified join</small></span></button>
                <button class="ct-type ${!isApi ? 'on' : ''}" data-vtype="link"><span class="ct-type-ic">🔗</span><span><b>Bot / Website</b><small>Any link</small></span></button>
            </div>

            <div class="ct-label">Task title</div>
            <input class="field-input" id="ct-title" placeholder="e.g. Join our official channel" maxlength="80" value="${esc(formData.title)}">

            ${isApi ? `
                <div class="ct-label">Channel / group username</div>
                <div class="ct-row">
                    <input class="field-input" id="ct-channel" placeholder="@your_channel" value="${esc(formData.channelUsername)}" autocapitalize="off" autocomplete="off">
                    <button class="ct-verify ${isVerified ? 'ok' : ''}" id="ct-verify">${isVerified ? '✓ Verified' : 'Verify bot'}</button>
                </div>
                <div class="ct-note ${isVerified ? 'ok' : ''}" id="ct-note">${isVerified
                    ? `✓ GameVo Mine bot is an admin in @${esc(chNorm)}`

            ` : `
                <div class="ct-label">Link (Telegram bot or website)</div>
                <input class="field-input" id="ct-url" placeholder="https://..." value="${esc(formData.url)}" autocapitalize="off" autocomplete="off">
            `}

            <div class="ct-label">Package · pay with TON</div>
            <div class="ct-pkgs">
                ${Object.entries(TASK_CREATE_PACKAGES_DISPLAY).map(([count, p]) => `
                    <button class="ct-pkg ${formData.package === count ? 'on' : ''}" data-pkg="${count}">
                        ${BADGES[count] ? `<span class="ct-badge">${BADGES[count]}</span>` : ''}
                        <span class="ct-pkg-n">${Number(count).toLocaleString('en-US')}</span>
                        <span class="ct-pkg-u">users</span>
                        <span class="ct-pkg-p">💎 ${p.toFixed(2)} TON</span>
                    </button>`).join('')}
            </div>

            <div class="ct-reward">🎁 Every user who completes it gets <b>${TASK_CREATE_REWARD_PER_TASK_WTC_DISPLAY} GM coin</b></div>

            <div class="ct-sum">
                <div><small>You are buying</small><b>${Number(formData.package).toLocaleString('en-US')} completions</b></div>
                <div class="ct-sum-p">💎 ${price.toFixed(2)} TON</div>
            </div>
            <button class="btn btn-primary" id="ct-submit" style="width:100%; margin-top:12px;">Pay ${price.toFixed(2)} TON</button>
        `;

        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this){window.__closeCreateTask?.();}">
                <div class="sheet anim-in" style="max-height:90vh; overflow-y:auto;">
                    <div class="sheet-handle"></div>
                    <div class="ct-head">
                        <div class="ct-title">🚀 Promote a Task</div>
                        <button class="ct-x" id="ct-x" aria-label="Close">✕</button>
                    </div>
                    <div class="ct-tabs">
                        <button data-ctab="new" class="${isNew ? 'on' : ''}">＋ New Task</button>
                        <button data-ctab="history" class="${!isNew ? 'on' : ''}">📋 My Tasks</button>
                    </div>
                    ${isNew ? formHtml : `<div id="ct-hist"><div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div><div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div></div>`}
                </div>
            </div>`;

        document.getElementById('ct-x').onclick = () => close();
        document.querySelectorAll('[data-ctab]').forEach(b => b.onclick = () => { captureFormFields(); renderMain(b.dataset.ctab); });

        if (!isNew) { paintHistory(); return; }

        document.querySelectorAll('[data-vtype]').forEach(b => b.onclick = () => { captureFormFields(); formData.verifyType = b.dataset.vtype; renderMain('new'); });
        document.querySelectorAll('[data-pkg]').forEach(b => b.onclick = () => { captureFormFields(); formData.package = b.dataset.pkg; renderMain('new'); });
        document.getElementById('ct-submit').onclick = submitForm;

        if (isApi) {
            // typing a different username after verifying invalidates the ✓ right away
            document.getElementById('ct-channel').oninput = (e) => {
                const stillOk = !!formData.verified && formData.verified === normChannel(e.target.value);
                const vb = document.getElementById('ct-verify'); const nt = document.getElementById('ct-note');
                if (!vb || !nt) return;
                vb.classList.toggle('ok', stillOk);
                vb.textContent = stillOk ? '✓ Verified' : 'Verify bot';
                nt.classList.toggle('ok', stillOk);
                nt.textContent = stillOk
                    ? `✓ GameVo Mine bot is an admin in @${normChannel(e.target.value)}`
                    : '⚠️ Add the GameVo Mine bot as an Admin there first, then tap Verify bot. You can pay only after it is verified.';
            };
            document.getElementById('ct-verify').onclick = async () => {
                captureFormFields();
                const ch = normChannel(formData.channelUsername);
                if (!ch) return toast('Enter the channel/group username first.', 'error');
                const vb = document.getElementById('ct-verify');
                vb.disabled = true; vb.textContent = 'Checking…';
                const r = await apiPost('payments', { resource: 'taskcreate', action: 'verifyBot', channelUsername: ch });
                if (!document.getElementById('ct-verify')) return; // modal closed before this resolved
                captureFormFields();
                if (r.ok) { formData.verified = ch; toast('Bot verified ✓', 'success'); }
                else { formData.verified = ''; toast(errorText(r.error), 'error'); }
                renderMain('new');
            };
        }
    }

    async function submitForm() {
        captureFormFields();
        formData.title = formData.title.trim();
        if (!formData.title) return toast('Please enter a task title.', 'error');
        if (formData.verifyType === 'api') {
            const ch = normChannel(formData.channelUsername);
            if (!ch) return toast('Please enter a channel/group username.', 'error');
            if (formData.verified !== ch) return toast('Tap "Verify bot" first — the bot must be admin there.', 'error');
        }
        if (formData.verifyType === 'link' && !formData.url.trim()) return toast('Please enter a link.', 'error');

        const btn = document.getElementById('ct-submit');
        const idleLabel = btn.textContent;
        btn.textContent = 'Creating order...';
        btn.disabled = true;
        const r = await apiPost('payments', {
            resource: 'taskcreate',
            action: 'create',
            package: formData.package,
            title: formData.title,
            verifyType: formData.verifyType,
            channelUsername: formData.channelUsername,
            url: formData.url,
        });
        if (!document.getElementById('ct-submit')) return; // modal closed before this resolved
        if (!r.ok) {
            toast(errorText(r.error), 'error');
            btn.textContent = idleLabel;
            btn.disabled = false;
            return;

        order = r.order;
        renderPay();

                    <button class="btn btn-outline" id="ct-cancel" style="width:100%; margin-top:14px; font-size:12.5px;">Cancel order</button>

            </div>`;

        document.getElementById('ct-copy-addr').onclick = () => { navigator.clipboard.writeText(order.address); toast('Address copied!', 'success'); };
        document.getElementById('ct-copy-memo').onclick = () => { navigator.clipboard.writeText(order.memo); toast('Memo copied!', 'success'); };

    function startCountdown() {
        const expiresAt = new Date(order.expiresAt).getTime();
        const tick = () => {
            const el = document.getElementById('ct-countdown');
            if (!el) { clearInterval(countdownTimer); return; }
            const msLeft = expiresAt - Date.now();
            if (msLeft <= 0) {
                el.textContent = 'Expired';
                clearInterval(countdownTimer);
                return;
            }
            const mm = Math.floor(msLeft / 60000);
            const ss = Math.floor((msLeft % 60000) / 1000);
            el.textContent = `Auto-cancels in ${mm}:${String(ss).padStart(2, '0')} if unpaid`;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    function startPolling() {
        pollTimer = setInterval(async () => {
            const s = await apiGet(`payments?resource=taskcreate&action=status&orderId=${order.id}&initData=${encodeURIComponent(TG_INIT_DATA)}`);
            if (!document.getElementById('ct-status-line')) { clearInterval(pollTimer); return; } // modal closed
            if (!s.ok) return; // transient error — just try again next tick
            if (s.status === 'paid') {
                stopTimers();
                triggerBurst(document.getElementById('modal-root'));
                showCongrats('Payment Confirmed!', '⏳');

let __contestCache = null;   // {at, top} - the leaderboard is fetched at most once a minute
async function paintContest(body) {
    const u = state.user || {};
    const mine = u.weeklyReferralCount || 0, need = WEEKLY_REFERRAL_MIN_COUNT_DISPLAY, wins = WEEKLY_REFERRAL_MAX_WINNERS_DISPLAY;
    const ok = mine >= need, pct = Math.min(100, Math.round(mine / need * 100));
    body.innerHTML = `
        <div class="ct-hero"><h3>Weekly Referral Contest</h3><p>Invite ${need}+ new friends this week to qualify. The top ${wins} qualifying referrers win a reward. The week restarts when the admin ends it.</p></div>

    if (__contestCache && Date.now() - __contestCache.at < 60000) top = __contestCache.top;
    else {
        const r = await apiGet('data?type=weeklyContest');
        if (!document.getElementById('ct-list')) return;       // user switched tab meanwhile
        top = r.ok ? (r.top || []) : null;
        if (top) __contestCache = { at: Date.now(), top };

    const list = document.getElementById('ct-list');
    if (!list) return;
    if (!top || !top.length) { list.innerHTML = `<div class="muted" style="text-align:center; padding:22px 12px; font-size:13px;">${top ? 'No referrals yet this week — be the first! 🚀' : 'Could not load the list. Please try again.'}</div>`; return; }
    const medal = ['🥇', '🥈', '🥉'];
    list.innerHTML = top.map((p, i) => `
        <div class="ct-row ${i < 3 ? 'top' + (i + 1) : ''}">

}

            track.style.transform = `translateX(${-idx * 100}%)`;

            dots.forEach((el, k) => el.classList.toggle('on', k === idx));
            label.textContent = idx === SLIDES.length - 1 ? 'Get Started' : 'Next';
        }
        function finish() {
            if (finished) return; finished = true;
            try { localStorage.setItem(GVM_ONB_KEY, '1'); } catch (e) {}
            root.classList.add('out');
            setTimeout(() => { root.remove(); resolve(); }, 450);
        }
        root.querySelector('#onb-skip').addEventListener('click', finish);
        root.querySelector('#onb-next').addEventListener('click', () => { idx >= SLIDES.length - 1 ? finish() : go(idx + 1); });

        // swipe / drag (touch + mouse)
        let sx = 0, sy = 0, dx = 0, dragging = false, locked = false;
        vp.addEventListener('pointerdown', e => { dragging = true; locked = false; sx = e.clientX; sy = e.clientY; dx = 0; });
        vp.addEventListener('pointermove', e => {
            if (!dragging) return;
            const mx = e.clientX - sx, my = e.clientY - sy;
            if (!locked && Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) { locked = true; track.classList.add('drag'); }
            if (!locked) return;
            dx = mx;
            const w = vp.clientWidth || 1;
            let off = -idx * w + dx;
            if ((idx === 0 && dx > 0) || (idx === SLIDES.length - 1 && dx < 0)) off = -idx * w + dx * 0.3; // rubber-band at the ends
            track.style.transform = `translateX(${off}px)`;
        });
        const endDrag = () => {
            if (!dragging) return; dragging = false;
            if (!locked) return;
            const w = vp.clientWidth || 1;
            if (dx < -w * 0.18) go(idx + 1); else if (dx > w * 0.18) go(idx - 1); else go(idx);
        };
        vp.addEventListener('pointerup', endDrag); vp.addEventListener('pointercancel', endDrag); vp.addEventListener('pointerleave', endDrag);

        requestAnimationFrame(() => requestAnimationFrame(() => go(0)));
    });
}

async function init() {
    const splashStart = performance.now();

    // ── Telegram-only gate ── matches the original app's behavior: wait briefly
    // for Telegram's WebApp bridge to deliver initData, and if it never does
    // (because this was opened in a regular browser, not via Telegram), block
    // entirely instead of silently falling back to a fake/demo identity.
    if (!hydrateDisplayUserFields()) {
        await new Promise(r => setTimeout(r, 800));
        if (!hydrateDisplayUserFields()) {
            await new Promise(r => setTimeout(r, 1500));
        }
    }
    if (!TG_INIT_DATA || !hydrateDisplayUserFields()) {
        document.getElementById('splash').remove();
        document.getElementById('app-root').innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; text-align:center; padding:0 30px;">
                <div style="font-size:48px;">📱</div>
                <div style="font-family:var(--font-display); font-weight:700; font-size:17px;">Open this in Telegram</div>
                <div class="muted" style="font-size:13px; line-height:1.6;">GameVo Mine only works inside the Telegram app. Please open it via the GameVo Mine bot.</div>
            </div>`;
        return;
    }

    const __fp = await generateDeviceFingerprint();
    let initRes = await apiPost('user', { action: 'init', fingerprint: __fp });
    // one automatic retry for temporary problems (slow VPN, serverless cold start, DB waking up)
    if (initRes && initRes.ok === false && ['timeout', 'network_error', 'server_error', 'db_error'].includes(initRes.error)) {
        await new Promise(r => setTimeout(r, 1500));
        initRes = await apiPost('user', { action: 'init', fingerprint: __fp });
    }
    if (initRes && initRes.ok === false && initRes.error === 'ip_in_use') {
        const splashEl = document.getElementById('splash');
        if (splashEl) splashEl.remove();
        showIpInUseScreen(initRes.owner);
        return;
    }
    // ⚠️ FIX — any OTHER init failure (timeout, 500, cold-start DB error, etc.)
    // used to be silently ignored here — execution just carried on into
    // refreshUser() as if init had succeeded. Now any non-ip_in_use failure
    // goes straight to the retry screen instead of limping forward.
    if (!initRes || initRes.ok === false) {
        showConnectionErrorScreen(initRes || 'no_response');
        return;
    }
    try {
        await refreshUser(initRes.user);
    } catch (e) {
        if (e.message === 'banned') {
            // Ban screen already shown in refreshUser() — remove splash and stop
            const splash = document.getElementById('splash');
            if (splash) { splash.classList.add('out'); setTimeout(() => splash.remove(), 550); }
            return;
        }
        // ⚠️ FIX — connection_timeout / connection_failed / any other unexpected
        // error now shows a visible retry screen instead of either hanging on
        // the static "92%" splash forever (old timeout-less fetch) or, if it
        // did resolve, silently proceeding with no user data and breaking
        // downstream renders with no explanation to the user.
        showConnectionErrorScreen(e && e.message ? 'profile: ' + e.message : 'profile_failed');
        return;
    }

    // Splash stays at least SPLASH_MIN_MS so the whole pickaxe → strike → gem → logo → loading animation is always seen,
    // even when the network is fast. Then the bar snaps to 100% and the splash fades out.
    const SPLASH_MIN_MS = 3300;
    const elapsed = performance.now() - splashStart;
    if (elapsed < SPLASH_MIN_MS) await new Promise(r => setTimeout(r, SPLASH_MIN_MS - elapsed));
    if (window.__splashFinish) window.__splashFinish();
    await new Promise(r => setTimeout(r, 350));
    const splash = document.getElementById('splash');
    splash.classList.add('out');
    setTimeout(() => splash.remove(), 550);

    // No channel/community join gate anymore. The server is still pinged once so the account gets marked
    // verified (referral step 1 + mining boost). It never blocks the user.
    // 22 Oct 2026: at most once per 24h per user (it costs 2 Telegram API calls + DB writes on the server each time)
    try {
        const cjKey = 'gvm_cj_' + USER_ID, cjLast = Number(localStorage.getItem(cjKey) || 0);
        if (Date.now() - cjLast > 24 * 3600 * 1000) { localStorage.setItem(cjKey, String(Date.now())); apiGet(`user?action=checkJoin&initData=${encodeURIComponent(TG_INIT_DATA)}`).catch(() => {}); }
    } catch (e) { apiGet(`user?action=checkJoin&initData=${encodeURIComponent(TG_INIT_DATA)}`).catch(() => {}); }
    if (!onboardingSeen()) { try { await showOnboarding(); } catch (e) { console.warn('onboarding failed', e); } }
    startApp();
}

function startApp() {
    renderShell();
    switchTab('mining');
    maybeShowAppOpenAdsgram(); // 18 Oct 2026: no longer shows an ad (app-open ad removed) — only marks the app as started. // after the splash/home entrance animation, so the two don't show at once
}

// ⚠️ FIX — pure canvas+screen+locale+timezone+cores fingerprinting collides
// across DIFFERENT physical devices when the hardware/software is common
// (same cheap Android model, same GPU, same Asia/Dhaka timezone, same bn/en
// locale — exactly the typical profile for our user base). That made the
// "device already in use" gate hard-block genuinely different people on
// genuinely different phones, which is what was being reported as false
// account suspensions.
//
// Fix: mix in a random, install-scoped ID that's generated once and
// persisted in localStorage. This is the dominant entropy source now — two
// physically identical phones will still get different fingerprints because
// each one rolled its own random ID on first launch. localStorage clears if
// the user clears app data / reinstalls, which starts a "new device" for
// gating purposes — same trade-off every app with this pattern accepts.
function getOrCreateInstallId() {
    try {
        const KEY = 'nt_install_id';
        let id = localStorage.getItem(KEY);
        if (!id) {
            id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
            localStorage.setItem(KEY, id);
        }
        return id;
    } catch { return ''; } // localStorage unavailable — falls back to the weaker hardware-only signal below
}

async function generateDeviceFingerprint() {
    try {
        const parts = [];
        parts.push(getOrCreateInstallId()); // dominant entropy source, see note above
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 200; canvas.height = 50;
        ctx.textBaseline = 'top'; ctx.font = '14px Arial'; ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 100, 20);
        ctx.fillStyle = '#069'; ctx.fillText('NEWTUBE-fp', 2, 15);
        parts.push(canvas.toDataURL());
        parts.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
        parts.push(navigator.language || '');
        parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
        parts.push(navigator.hardwareConcurrency || '');
        const data = new TextEncoder().encode(parts.join('|||'));
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch { return null; }
}

// ⚠️ NEW — absolute last-resort safety net. If ANY future script (ad SDK or
// otherwise) ever blocks parsing again, or init() throws something not
// caught above, this guarantees the user is never stuck on the static "92%"
// splash forever — after 20s, if the splash is still there, force the
// connection-error/retry screen.
// 22 Oct 2026: 20s -> 75s. Two API calls can take up to 30s each on a slow VPN, so 20s cut a healthy-but-slow start short.
setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash && !splash.classList.contains('out')) showConnectionErrorScreen('startup_timeout');
}, 75000);

init();
</script>
